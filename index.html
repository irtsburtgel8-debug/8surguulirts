<style>

  #app { width: 100%; max-width: 520px; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 95px; overflow-x: hidden; box-shadow: 0 0 40px rgba(15, 23, 42, 0.1); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .hdr { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #a855f7 100%); color: #fff; padding: 24px 20px 34px; border-radius: 0 0 32px 32px; box-shadow: 0 12px 30px -8px rgba(99, 102, 241, 0.35); position: sticky; top: 0; z-index: 40; }
  .hdr-top { display: flex; justify-content: space-between; align-items: center; }

  .wrap { padding: 16px; margin-top: -20px; position: relative; z-index: 41; display: flex; flex-direction: column; gap: 14px; animation: fadeIn 0.25s ease-out; }

  input, select, textarea { width: 100%; padding: 13px 15px; border-radius: 16px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-size: 13px; color: var(--txt); margin-bottom: 10px; outline: none; font-weight: 600; }

  .btn { width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .btn:active { transform: scale(0.96); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 5px; background: #e2e8f0; border-radius: 18px; }

  .class-btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }

  .class-btn.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #ffffff; border-color: transparent; box-shadow: 0 6px 15px -3px rgba(99, 102, 241, 0.4); }

  .hour-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }

  .hour-btn.active-zero { background: #ecfdf5; color: #059669; border-color: #34d399; }
  .hour-btn.active-abs { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #ffffff; border-color: transparent; }

  .dash-box { border-radius: 22px; padding: 16px; margin-bottom: 14px; background: #ffffff; box-shadow: var(--soft-shadow); border: 1.5px solid #e2e8f0; }
  .dash-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 14px; background: #f8fafc; margin-bottom: 7px; font-size: 12px; font-weight: 700; border-left: 4px solid var(--pri); }
  .dash-rank { font-weight: 900; padding: 4px 9px; border-radius: 10px; font-size: 11px; white-space: nowrap; }

  .st-card { background: #ffffff; border-radius: 22px; padding: 15px; margin-bottom: 12px; border: var(--card-border); box-shadow: var(--soft-shadow); }
  .st-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .st-name-wrap { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; color: #0f172a; }
  .avatar { width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(135deg, #e0e7ff, #ede9fe); color: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .st-right { display: flex; align-items: center; gap: 6px; }
  .status-mini { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 10px; background: #f8fafc; color: var(--mut); }
  .dots-btn { background: #eef2ff; border: 1.5px solid #c7d2fe; color: #4338ca; width: 34px; height: 34px; border-radius: 11px; font-size: 17px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .chips { display: flex; gap: 8px; }
  .chip { flex: 1; text-align: center; padding: 9px 6px; border-radius: 14px; font-size: 11px; font-weight: 700; cursor: pointer; user-select: none; border: 1.5px solid transparent; }
  .c-pres { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
  .c-abs { background: #fff1f2; color: #e11d48; border-color: #fecdd3; }
  .c-sick { background: #fffbeb; color: #d97706; border-color: #fde68a; }
  .c-leav { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
  .c-uni-y { background: #f0f9ff; color: #0284c7; border-color: #bae6fd; }
  .c-uni-n { background: #fff1f2; color: #e11d48; border-color: #fecdd3; }
  .c-hw-y { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; }
  .c-hw-n { background: #fff7ed; color: #ea580c; border-color: #fed7aa; }
  .c-zero { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; }

  .extra-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .mini-tag { font-size: 10px; font-weight: 800; padding: 4px 9px; border-radius: 9px; display: inline-flex; align-items: center; gap: 4px; }

  .date-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .date-bar input { margin-bottom: 0; flex: 1; font-weight: 800; color: var(--pri-d); background: #fff; }

  .donuts-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .donuts-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: center; }
  .d-box { background: #f8fafc; padding: 12px 6px; border-radius: 18px; border: 1px solid #f1f5f9; }
  .d-lbl { font-size: 10px; font-weight: 800; color: var(--mut); margin-bottom: 6px; }

  .bars { display: flex; align-items: flex-end; justify-content: space-around; height: 140px; padding: 20px 10px 6px; background: #f8fafc; border-radius: 18px; border: 1px solid #f1f5f9; gap: 8px; }
  .b-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
  .b-fill { width: 100%; max-width: 30px; border-radius: 10px 10px 4px 4px; min-height: 6px; }
  .b-val { font-size: 11px; font-weight: 800; margin-bottom: 4px; color: var(--txt); }
  .b-txt { font-size: 9px; font-weight: 700; color: var(--mut); margin-top: 6px; text-align: center; }

  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-pill { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 16px; padding: 12px; text-align: center; }
  .stat-pill .num { font-size: 19px; font-weight: 900; }
  .stat-pill .lbl { font-size: 11px; font-weight: 700; color: var(--mut); margin-top: 3px; }

  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(6px); z-index: 999; display: none; justify-content: center; align-items: flex-end; }
  .sheet { background: #ffffff; width: 100%; max-width: 520px; max-height: 88vh; border-radius: 30px 30px 0 0; padding: 22px 20px; overflow-y: auto; box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.15); }
  .sheet-handle { width: 42px; height: 5px; background: #cbd5e1; border-radius: 10px; margin: -6px auto 14px; }
  .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.92); color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 12px; font-weight: 700; z-index: 2000; display: none; text-align: center; width: 88%; max-width: 400px; }
  .u-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: #f8fafc; border-radius: 15px; margin-bottom: 8px; border-left: 4px solid var(--pri); font-size: 12px; }
  .arch-tbl { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
  .arch-tbl th, .arch-tbl td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #f1f5f9; }
  .arch-tbl th { background: #f8fafc; color: var(--mut); font-weight: 800; }
  .arch-tbl td:first-child, .arch-tbl th:first-child { text-align: left; font-weight: 700; }
  .copyright-footer { text-align: center; font-size: 11px; color: var(--mut); margin-top: 20px; font-weight: 600; padding-bottom: 10px; }
  .sec-box { background: #fff1f2; border: 1.5px solid #fecdd3; padding: 12px; border-radius: 16px; margin-bottom: 12px; }
  .sec-lbl { font-size: 11px; font-weight: 800; color: #e11d48; display: block; margin-bottom: 6px; }
  .st-manage-scroll { max-height: 340px; overflow-y: auto; padding-right: 4px; }
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const FB_URL = 'https://surguul-5405b-default-rtdb.firebaseio.com';
const FB_REST_ENDPOINT = `${FB_URL}/smart_school_v1.json`;
const KEY = 'smart_school_8_v9';

let memDB = null;
let cloudRef = null;
let cloudStatus = '⏳ Холбогдож байна...';
let isApplyingRemote = false;
let saveTimer = null;

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}

function parseDateStr(str) {
  const parts = String(str || '').split('.');
  if (parts.length < 3) return 0;
  return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)).getTime();
}

function normalizeDate(str) {
  if (!str) return getTodayStr();
  const cleaned = str.trim().replace(/[-/]/g, '.');
  const parts = cleaned.split('.').map(x => parseInt(x, 10)).filter(x => !isNaN(x));
  if (parts.length === 3) return `${parts[0]}.${parts[1]}.${parts[2]}`;
  return cleaned;
}

function getCurrentWeekMondayStr() {
  const now = new Date();
  const day = now.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return `${mon.getFullYear()}.${mon.getMonth() + 1}.${mon.getDate()}`;
}

function defaultData() {
  return {
    lastWeeklyResetMonday: getCurrentWeekMondayStr(),
    lastLateResetDate: getTodayStr(),
    users: [
      { u: 'manager', p: '1234', role: 'manager', cls: 'Бүгд', label: 'Сургуулийн Менежер' },
      { u: 'social', p: '1234', role: 'social', cls: 'Бүгд', label: 'Нийгмийн Ажилтан' }
    ],
    classes: {}
  };
}

function ensureStructure(data) {
  if (!data || typeof data !== 'object') return defaultData();
  if (!Array.isArray(data.users)) data.users = defaultData().users;
  if (!data.classes || typeof data.classes !== 'object') data.classes = {};
  if (!data.lastWeeklyResetMonday) data.lastWeeklyResetMonday = getCurrentWeekMondayStr();
  if (!data.lastLateResetDate) data.lastLateResetDate = getTodayStr();

  Object.keys(data.classes).forEach(k => {
    const c = data.classes[k];
    if (!c.shift) c.shift = 'Өглөө';
    if (!c.schedule) c.schedule = { 1: [], 2: [], 3: [], 4: [], 5: [] };
    for (let d = 1; d <= 5; d++) {
      if (!Array.isArray(c.schedule[d])) c.schedule[d] = [];
    }
    if (!Array.isArray(c.students)) c.students = [];
    if (!c.records || typeof c.records !== 'object') c.records = {};
  });
  return data;
}

function getSortedClassList() {
  if (!db || !db.classes) return [];
  return Object.keys(db.classes).sort((a, b) => a.localeCompare(b, 'mn', { numeric: true }));
}

function checkAndRunAutoResets(shouldSave = true) {
  if (!db || !db.classes) return;
  let changed = false;

  const todayStr = getTodayStr();
  const curMondayStr = getCurrentWeekMondayStr();
  const curMondayMs = parseDateStr(curMondayStr);

  if (db.lastLateResetDate !== todayStr) {
    Object.keys(db.classes).forEach(cName => {
      const recs = db.classes[cName].records || {};
      Object.keys(recs).forEach(dKey => {
        if (dKey !== todayStr) {
          Object.keys(recs[dKey] || {}).forEach(stIdx => {
            if (recs[dKey][stIdx] && recs[dKey][stIdx].lateMin) {
              recs[dKey][stIdx].lateMin = 0;
            }
          });
        }
      });
    });
    db.lastLateResetDate = todayStr;
    changed = true;
  }

  if (db.lastWeeklyResetMonday !== curMondayStr) {
    Object.keys(db.classes).forEach(cName => {
      const recs = db.classes[cName].records || {};
      Object.keys(recs).forEach(dKey => {
        if (parseDateStr(dKey) < curMondayMs) {
          delete recs[dKey];
        }
      });
    });
    db.lastWeeklyResetMonday = curMondayStr;
    changed = true;
  }

  if (changed && shouldSave) {
    saveDB();
  }
}

let db = ensureStructure(loadDBLocal());

function loadDBLocal() {
  const keysToTry = [KEY, 'smart_school_8_v8', 'smart_school_8_v7', 'smart_school_8_v6', 'smart_school_8_v5'];
  for (let i = 0; i < keysToTry.length; i++) {
    try {
      const s = window.localStorage.getItem(keysToTry[i]);
      if (s) {
        const parsed = JSON.parse(s);
        if (parsed && parsed.users && parsed.users.length > 0) return parsed;
      }
    } catch(e) {}
  }
  return defaultData();
}

function saveLocalOnly() {
  try { window.localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
}

function pushToCloud() {
  if (isApplyingRemote) return;
  const payloadObj = { payload: JSON.stringify(db), updatedAt: Date.now() };

  if (cloudRef) {
    cloudRef.set(payloadObj).then(() => {
      cloudStatus = '☁️ Онлайн';
      updateCloudBadge();
    }).catch(() => {
      pushViaRest(payloadObj);
    });
  } else {
    pushViaRest(payloadObj);
  }
}

function pushViaRest(payloadObj) {
  fetch(FB_REST_ENDPOINT, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payloadObj)
  }).then(r => {
    if (r.ok) {
      cloudStatus = '☁️ Онлайн';
      updateCloudBadge();
    }
  }).catch(() => {
    cloudStatus = '⚠️ Офлайн';
    updateCloudBadge();
  });
}

function saveDB(debounce = false) {
  saveLocalOnly();
  if (debounce) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => pushToCloud(), 450);
  } else {
    pushToCloud();
  }
}

function applyIncomingCloudData(val) {
  if (!val || !val.payload) {
    cloudStatus = '☁️ Онлайн';
    updateCloudBadge();
    return;
  }
  try {
    const parsed = ensureStructure(JSON.parse(val.payload));
    isApplyingRemote = true;
    db = parsed;
    checkAndRunAutoResets(false);

    if (curUser) {
      const updatedMe = db.users.find(x => x.u.toLowerCase() === curUser.u.toLowerCase());
      if (updatedMe) curUser = updatedMe;
    }

    saveLocalOnly();
    isApplyingRemote = false;
    cloudStatus = '☁️ Онлайн';

    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    const isModalOpen = document.getElementById('modal').style.display === 'flex';
    if (!isModalOpen && activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
      render();
    } else {
      updateCloudBadge();
    }
  } catch (e) {
    isApplyingRemote = false;
  }
}

function manualSyncCloud() {
  cloudStatus = '🔄 Шинэчилж байна...';
  updateCloudBadge();
  fetch(FB_REST_ENDPOINT)
    .then(r => r.json())
    .then(data => {
      if (data && data.payload) {
        applyIncomingCloudData(data);
        notify('☁️ Мэдээлэл шинэчлэгдлээ!');
      } else {
        pushToCloud();
        notify('☁️ Үүлэн санах ойд хадгалагдлаа!');
      }
    })
    .catch(() => {
      cloudStatus = '⚠️ Офлайн';
      updateCloudBadge();
      notify('⚠️ Интернэт холболтоо шалгана уу!');
    });
}

function initFirebaseCloud() {
  fetch(FB_REST_ENDPOINT)
    .then(r => r.json())
    .then(data => applyIncomingCloudData(data))
    .catch(() => {
      cloudStatus = '⚠️ Офлайн';
      updateCloudBadge();
    });

  try {
    if (typeof firebase !== 'undefined') {
      if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FB_URL });
      cloudRef = firebase.database().ref('smart_school_v1');
      cloudRef.on('value', snapshot => {
        const val = snapshot.val();
        if (val) applyIncomingCloudData(val);
      });
    }
  } catch (e) {}
}

function updateCloudBadge() {
  const el = document.getElementById('cloud_ind');
  if (el) el.innerText = cloudStatus + ' 🔄';
}

checkAndRunAutoResets(false);

let curUser = null;
let curTab = 'main';
let curDate = getTodayStr();
let curDay = new Date().getDay() || 1;
if (curDay > 5) curDay = 1;
let curClassFilter = getSortedClassList()[0] || '';
let curArchiveClass = 'Бүгд';
let curPeriod = '7d';
let selectedDashDownload = 'all';

function isEditLocked() {
  if (!curUser || (curUser.role !== 'teacher' && curUser.role !== 'leader')) return false;
  const curMs = parseDateStr(curDate);
  const todayMs = parseDateStr(getTodayStr());
  if (curMs < todayMs) {
    notify('⚠️ Өнгөрсөн өдрийн мэдээллийг засах боломжгүй!');
    return true;
  }
  return false;
}

function verifyManagerPassword(inputPass) {
  const mgr = db.users.find(u => u.role === 'manager') || curUser;
  if (!mgr) return false;
  return inputPass === mgr.p;
}

function notify(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2800);
}

function openModal(html) {
  const sh = document.getElementById('sheet');
  const md = document.getElementById('modal');
  if (sh && md) {
    sh.innerHTML = `<div class="sheet-handle"></div>` + html;
    md.style.display = 'flex';
  }
}

function closeModal() {
  const md = document.getElementById('modal');
  if (md) md.style.display = 'none';
}

function applyDateSearch(inputId) {

function getDayRecord(clsObj, dateStr, stIdx) {
  const dKey = normalizeDate(dateStr);
  if (!clsObj.records) clsObj.records = {};
  if (!clsObj.records[dKey]) clsObj.records[dKey] = {};
  if (!clsObj.records[dKey][stIdx]) {
    clsObj.records[dKey][stIdx] = {
      status: 'present',
      uniform: true,
      hw: {},
      leaveReason: '',
      lateMin: 0,
      skipHours: 0
    };
  }
  if (clsObj.records[dKey][stIdx].lateMin === undefined) clsObj.records[dKey][stIdx].lateMin = 0;
  if (clsObj.records[dKey][stIdx].skipHours === undefined) clsObj.records[dKey][stIdx].skipHours = 0;
  return clsObj.records[dKey][stIdx];
}

function isHwDoneForDate(clsObj, dateStr, stIdx, subj) {
  const rec = getDayRecord(clsObj, dateStr, stIdx);
  if (rec.status !== 'present') return false; 
  if (!rec.hw) rec.hw = {};
  if (rec.hw[subj] === undefined) rec.hw[subj] = true;
  return rec.hw[subj];
}

function updateLeaveReason(idx, val) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  rec.leaveReason = val.substring(0, 40); 
  saveDB(true);
}

function getStudentPersonalStats(clsObj, stIdx) {
  let present = 0, absent = 0, leave = 0, sick = 0, noUni = 0, noHw = 0, midSkipCnt = 0, midSkipHours = 0;
  const history = [];
  
  Object.keys(clsObj.records || {}).sort().reverse().forEach(dKey => {
    const r = clsObj.records[dKey][stIdx];
    if (!r) return;
    if (r.skipHours > 0) {
      midSkipCnt++;
      midSkipHours += r.skipHours;
    }
    if (r.status === 'absent') {
      absent++;
      history.push({ date: dKey, txt: `❌ Тасалсан${r.skipHours ? ' (' + r.skipHours + ' цаг)' : ''}` });
    } else if (r.status === 'leave') {
      leave++;
      const reasonTxt = r.leaveReason ? ` | Шалтгаан: ${r.leaveReason}` : '';
      history.push({ date: dKey, txt: `🏃 Чөлөөтэй${reasonTxt}` });
    } else if (r.status === 'sick') {
      sick++;
      const reasonTxt = r.leaveReason ? ` | Шалтгаан: ${r.leaveReason}` : '';
      history.push({ date: dKey, txt: `🤒 Өвчтэй${reasonTxt}` });
    } else if (r.status === 'present') {
      present++;
      if (!r.uniform) noUni++;
      const missedList = Object.keys(r.hw || {}).filter(k => r.hw[k] === false);
      if (missedList.length > 0) noHw++;
      
      const parts = [];
      if (r.lateMin > 0) parts.push(`⏱️ Хоцролт: ${r.lateMin}м`);
      if (r.skipHours > 0) parts.push(`🏃 Дундаас тасалсан: ${r.skipHours}ц`);
      const extraInfo = parts.length > 0 ? ` | ${parts.join(' | ')}` : '';

      history.push({
        date: dKey,
        txt: `✅ Ирсэн | ${r.uniform ? '👕 Формтой' : '❌ Формгүй'}${extraInfo}`
      });
    }
  });

  return { present, absent, leave, sick, noUni, noHw, midSkipCnt, midSkipHours, history };
}

function computeAllDashboardsData() {
  const curMondayStr = getCurrentWeekMondayStr();
  const curMondayMs = parseDateStr(curMondayStr);
  const todayStr = getTodayStr();

  const fullAbsentList = [];
  const midSkipList = [];
  const noUniformList = [];
  const dailyLateList = [];

  const clsKeys = getSortedClassList();
  clsKeys.forEach(cName => {
    const cObj = db.classes[cName];
    if (!cObj || !Array.isArray(cObj.students)) return;

    cObj.students.forEach((st, idx) => {
      let fullAbsCnt = 0;
      let midSkipTimes = 0;
      let midSkipTotalHours = 0;
      let noUniCnt = 0;

      Object.keys(cObj.records || {}).forEach(dKey => {
        if (parseDateStr(dKey) >= curMondayMs) {
          const r = cObj.records[dKey][idx];
          if (!r) return;
          if (r.status === 'absent') fullAbsCnt++;
          if (r.skipHours && r.skipHours > 0) {
            midSkipTimes++;
            midSkipTotalHours += r.skipHours;
          }
          if (r.status === 'present' && r.uniform === false) noUniCnt++;
        }
      });

      if (fullAbsCnt > 0) fullAbsentList.push({ name: st.name, cls: cName, count: fullAbsCnt });
      if (midSkipTotalHours > 0) midSkipList.push({ name: st.name, cls: cName, times: midSkipTimes, hours: midSkipTotalHours });
      if (noUniCnt > 0) noUniformList.push({ name: st.name, cls: cName, count: noUniCnt });

      const todayRec = (cObj.records && cObj.records[todayStr]) ? cObj.records[todayStr][idx] : null;
      if (todayRec && todayRec.lateMin && todayRec.lateMin > 0) {
        dailyLateList.push({ name: st.name, cls: cName, lateMin: todayRec.lateMin });
      }
    });
  });

  fullAbsentList.sort((a, b) => b.count - a.count);
  midSkipList.sort((a, b) => b.hours - a.hours || b.times - a.times);
  noUniformList.sort((a, b) => b.count - a.count);
  dailyLateList.sort((a, b) => b.lateMin - a.lateMin);

  return { fullAbsentList, midSkipList, noUniformList, dailyLateList, curMondayStr, todayStr };
}

function handleWeeklyDashboardDownload() {
  const selectEl = document.getElementById('dash_dl_select');
  const boardType = selectEl ? selectEl.value : selectedDashDownload;
  const dow = new Date().getDay();

  if (dow !== 5 && dow !== 6 && dow !== 0) {
    return notify('⚠️ Зөвхөн Баасан, Бямба, Ням гарагуудад татах боломжтой!');
  }
  executeWeeklyDashboardCSV(boardType);
}

function executeWeeklyDashboardCSV(boardType) {
  const { fullAbsentList, midSkipList, noUniformList, curMondayStr } = computeAllDashboardsData();
  let csv = '\uFEFFСамбарын төрөл,Эрэмбэ,Сурагчийн нэр,Анги,Үзүүлэлт,Огноо\n';

  if (boardType === 'all' || boardType === 'board1') {
    fullAbsentList.forEach((x, idx) => { csv += `"Бүтэн таслалт",${idx + 1},"${x.name}","${x.cls}","Таслалт ${x.count}","${curMondayStr}"\n`; });
  }
  if (boardType === 'all' || boardType === 'board2') {
    midSkipList.forEach((x, idx) => { csv += `"Дундаас таслалт",${idx + 1},"${x.name}","${x.cls}","${x.hours} цаг","${curMondayStr}"\n`; });
  }
  if (boardType === 'all' || boardType === 'board3') {
    noUniformList.forEach((x, idx) => { csv += `"Формгүй",${idx + 1},"${x.name}","${x.cls}","Формгүй ${x.count}","${curMondayStr}"\n`; });
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `Dashboard_${getTodayStr()}.csv`; a.click();
  notify('✅ Татагдлаа!');
}

function downloadDailyLateCSV() {
  const { dailyLateList, todayStr } = computeAllDashboardsData();
  let csv = '\uFEFFЭрэмбэ,Сурагчийн нэр,Анги,Хоцорсон минут,Огноо\n';
  dailyLateList.forEach((x, idx) => { csv += `${idx + 1},"${x.name}","${x.cls}","${x.lateMin} мин","${todayStr}"\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `Hotsrolt_${todayStr}.csv`; a.click();
  notify('✅ Хоцролтын архив татагдлаа!');
}

function downloadArchiveCSV(targetCls) {
  const clsList = (targetCls === 'Бүгд') ? getSortedClassList() : [targetCls];
  let csv = '\uFEFFАнги,Ээлж,Д/Д,Сурагчийн нэр,Ирсэн,Бүтэн тас,Дундаас тас (цаг),Чөлөө,Өвчтэй,Формгүй,Түүх\n';
  clsList.forEach(cName => {
    const cObj = db.classes[cName];
    if (!cObj || !cObj.students) return;
    cObj.students.forEach((st, idx) => {
      const s = getStudentPersonalStats(cObj, idx);
      const histStr = s.history.map(h => `${h.date}: ${h.txt}`).join(' || ').replace(/"/g, '""');
      csv += `"${cName}","${cObj.shift || 'Өглөө'}",${idx + 1},"${st.name.replace(/"/g, '""')}",${s.present},${s.absent},${s.midSkipHours},${s.leave},${s.sick},${s.noUni},"${histStr}"\n`;
    });
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `Arhiv_${targetCls}.csv`; a.click();
  notify('✅ Татагдлаа!');
}

function svgDonut(pct, color) {
  const r = 24, c = 2 * Math.PI * r;
  const off = c - (pct / 100) * c;
  return `
    <svg width="68" height="68" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="6.5"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6.5"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 32 32)"/>
      <text x="50%" y="54%" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">${pct}%</text>
    </svg>
  `;
}

function renderSocialAnalytics() {
  const isClassLocked = (curUser.role === 'teacher' || curUser.role === 'leader');
  const showHw = (curUser.role === 'teacher' || curUser.role === 'leader');
  const clsList = getSortedClassList();
  if (clsList.length === 0) return `<div class="card"><div class="title">⚠️ Анги байхгүй байна</div></div>`;

  if (isClassLocked) curClassFilter = curUser.cls;
  else if (!db.classes[curClassFilter]) curClassFilter = clsList[0];

  const clsObj = db.classes[curClassFilter];
  const sts = clsObj.students || [];
  const total = sts.length || 1;
  const subjs = (clsObj.schedule && clsObj.schedule[curDay]) ? clsObj.schedule[curDay] : [];

  let presCount = 0, uniCount = 0, hwDone = 0;
  const absList = [], midSkipTodayList = [], lateTodayList = [], leaveList = [], sickList = [], noUniList = [], noHwList = [];

  sts.forEach((s, idx) => {
    const rec = getDayRecord(clsObj, curDate, idx);
    if (rec.skipHours > 0) midSkipTodayList.push({ s, idx, skipHours: rec.skipHours });
    if (rec.lateMin > 0) lateTodayList.push({ s, idx, lateMin: rec.lateMin });

    if (rec.status === 'present') {
      presCount++;
      if (rec.uniform) uniCount++;
      else noUniList.push({ s, idx });

      let missedAny = false;
      subjs.forEach(sub => {
        if (isHwDoneForDate(clsObj, curDate, idx, sub)) hwDone++;
        else missedAny = true;
      });
      if (missedAny) noHwList.push({ s, idx });
    } else if (rec.status === 'absent') absList.push({ s, idx });
    else if (rec.status === 'leave') leaveList.push({ s, idx });
    else if (rec.status === 'sick') sickList.push({ s, idx });
  });

  const presentTotal = presCount || 1;
  const hwTotal = presCount * (subjs.length || 1);
  const attPct = sts.length ? Math.round((presCount / total) * 100) : 0;
  const uniPct = presCount ? Math.round((uniCount / presentTotal) * 100) : 0;
  const hwPct = (presCount && subjs.length) ? Math.round((hwDone / hwTotal) * 100) : 0;

  const mult = curPeriod === '7d' ? 1 : 4;
  let bAbs = 0, bMidSkip = 0, bLeave = 0, bSick = 0, bNoUni = 0, bNoHw = 0;
  sts.forEach((s, idx) => {
    const sStat = getStudentPersonalStats(clsObj, idx);
    bAbs += sStat.absent * mult;
    bMidSkip += sStat.midSkipCnt * mult;
    bLeave += sStat.leave * mult;
    bSick += sStat.sick * mult;
    bNoUni += sStat.noUni * mult;
    bNoHw += sStat.noHw * mult;
  });

  const barItems = [
    { lbl: 'Бүтэн тас', val: bAbs, col: '#f43f5e' },
    { lbl: 'Дундаас тас', val: bMidSkip, col: '#ec4899' },
    { lbl: 'Чөлөө', val: bLeave, col: '#a855f7' },
    ...(showHw ? [{ lbl: 'Д/Г дутуу', val: bNoHw, col: '#6366f1' }] : []),
    { lbl: 'Өвчтэй', val: bSick, col: '#f59e0b' },
    { lbl: 'Формгүй', val: bNoUni, col: '#38bdf8' }
  ];
  const maxB = Math.max(...barItems.map(x => x.val), 5);

  let classButtonsHtml = clsList.map(c => `
    <button class="class-btn ${curClassFilter===c?'active':''}" onclick="curClassFilter='${c}';render()">
      <span>${c}</span>
      <span class="sub-cnt">${(db.classes[c].students||[]).length} сурагч</span>
    </button>
  `).join('');

  let barsHtml = barItems.map(b => `
    <div class="b-col">
      <div class="b-val">${b.val}</div>
      <div class="b-fill" style="height:${Math.max(6, Math.round((b.val/maxB)*90))}px;background:${b.col}"></div>
      <div class="b-txt">${b.lbl}</div>
    </div>
  `).join('');

  return `
    ${renderDateSearchBox('an_date_inp')}
    ${!isClassLocked ? `
      <div class="card">
        <div class="title"><span>🏫 Анги сонгох</span></div>
        <div class="class-btn-grid">${classButtonsHtml}</div>
      </div>
    ` : ''}

    <div class="card">
      <div class="title">🎯 ${curDate} (${curClassFilter})</div>
      <div class="${showHw ? 'donuts-3' : 'donuts-2'}">
        <div class="d-box"><div class="d-lbl">📊 ИРЦ</div>${svgDonut(attPct, '#10b981')}</div>
        <div class="d-box"><div class="d-lbl">👕 ФОРМ</div>${svgDonut(uniPct, '#38bdf8')}</div>
        ${showHw ? `<div class="d-box"><div class="d-lbl">📝 ДААЛГАВАР</div>${svgDonut(hwPct, '#6366f1')}</div>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="title"><span>📊 Статистик</span></div>
      <div class="bars">${barsHtml}</div>
    </div>

    <div class="card">
      <div class="title">📋 ${curDate} зөрчил (${curClassFilter})</div>
      ${renderAlertGroup('❌ Бүтэн тасалсан', absList, '#f43f5e', clsObj)}
      ${renderAlertGroup('🏃 Дундаас тасалсан (1-7 цаг)', midSkipTodayList, '#ec4899', clsObj)}
      ${renderAlertGroup('⏱️ Хоцорсон', lateTodayList, '#f59e0b', clsObj)}
      ${renderAlertGroup('🏃 Чөлөөтэй', leaveList, '#a855f7', clsObj)}
      ${renderAlertGroup('🤒 Өвчтэй', sickList, '#d97706', clsObj)}
      ${renderAlertGroup('👕 Формгүй', noUniList, '#38bdf8', clsObj)}
      ${showHw ? renderAlertGroup('📝 Даалгавар дутуу', noHwList, '#6366f1', clsObj, subjs) : ''}
    </div>
  `;
}

function renderAlertGroup(title, list, color, clsObj, subjs = null) {
  if (list.length === 0) return `<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:800;color:${color}">${title} (0)</div><div style="font-size:11px;color:#059669;background:#ecfdf5;padding:6px 10px;border-radius:10px;font-weight:700">Зөрчилгүй ✅</div></div>`;
  
  let listHtml = list.map(item => {
    let extra = '';
    if (item.skipHours) extra += ` (${item.skipHours} цаг)`;
    if (item.lateMin) extra += ` (${item.lateMin} мин)`;
    return `<div style="padding:6px 10px;background:#f8fafc;border-left:3px solid ${color};border-radius:8px;font-size:11px;font-weight:700;margin-bottom:4px">${item.s.name}${extra}</div>`;
  }).join('');

  return `<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:800;color:${color};margin-bottom:4px">${title} (${list.length})</div>${listHtml}</div>`;
}

function removeStudent(idx) {
  const cls = db.classes[curUser.cls];
  if (!cls || !cls.students || !cls.students[idx]) return;
  const removedName = cls.students[idx].name;
  cls.students.splice(idx, 1);

  Object.keys(cls.records || {}).forEach(dKey => {
    const dayRec = cls.records[dKey];
    if (!dayRec || typeof dayRec !== 'object') return;
    const newDayRec = {};
    Object.keys(dayRec).forEach(k => {
      const kNum = parseInt(k, 10);
      if (kNum < idx) newDayRec[kNum] = dayRec[k];
      else if (kNum > idx) newDayRec[kNum - 1] = dayRec[k];
    });
    cls.records[dKey] = newDayRec;
  });

  saveDB();
  notify(`🗑️ ${removedName} сурагч хасагдлаа!`);
  render();
}

function removeDuplicateStudents() {
  const cls = db.classes[curUser.cls];
  if (!cls || !Array.isArray(cls.students) || cls.students.length === 0) return;
  const seen = new Set();
  const uniqueList = [];
  let removedCount = 0;

  cls.students.forEach(st => {
    const key = st.name.trim().toLowerCase();
    if (!seen.has(key)) {
      seen.add(key);
      uniqueList.push(st);
    } else {
      removedCount++;
    }
  });

  if (removedCount === 0) return notify('✅ Давхардсан нэр олдсонгүй!');
  cls.students = uniqueList;
  saveDB();
  notify(`🧹 ${removedCount} давхардсан нэр цэвэрлэгдлээ!`);
  render();
}

function saveShift() {
  db.classes[curUser.cls].shift = document.getElementById('t_shift').value;
  saveDB(); notify('✅ Хадгалагдлаа!');
}

function saveSchedule() {
  const cls = db.classes[curUser.cls];
  if (!cls.schedule) cls.schedule = {};
  [1,2,3,4,5].forEach(d => {
    const val = document.getElementById('sch_' + d).value;
    cls.schedule[d] = val.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  });
  saveDB();
  notify('✅ Хуваарь хадгалагдлаа!');
  render();
}

function addClassStudents() {
  const raw = document.getElementById('t_names').value.trim();
  if (!raw) return notify('⚠️ Нэр оруулна уу!');
  const names = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  const cls = db.classes[curUser.cls];
  if (!Array.isArray(cls.students)) cls.students = [];
  names.forEach(n => cls.students.push({ name: n }));
  saveDB();
  notify(`✅ ${names.length} сурагч нэмэгдлээ!`);
  render();
}

function renderAttendanceBoard(cls) {
  const dayNames = { 1:'Даваа', 2:'Мягмар', 3:'Лхагва', 4:'Пүрэв', 5:'Баасан' };
  if (!cls.schedule) cls.schedule = { 1:[], 2:[], 3:[], 4:[], 5:[] };
  const subjs = cls.schedule[curDay] || [];

  const stMap = {
    present: { lbl: '✅ Ирсэн', cls: 'c-pres' },
    absent: { lbl: '❌ Тасалсан', cls: 'c-abs' },
    sick: { lbl: '🤒 Өвчтэй', cls: 'c-sick' },
    leave: { lbl: '🏃 Чөлөөтэй', cls: 'c-leav' }
  };

  let dayTabsHtml = [1,2,3,4,5].map(d => `<button class="tab ${curDay===d?'active':''}" onclick="curDay=${d};render()">${dayNames[d]}</button>`).join('');
  const isLocked = parseDateStr(curDate) < parseDateStr(getTodayStr());

  let studentsHtml = '';
  if (!cls.students || cls.students.length === 0) {
    studentsHtml = `<div class="card"><div class="title">Сурагч бүртгэгдээгүй байна</div></div>`;
  } else {
    let studentRows = cls.students.map((s, idx) => {
      const rec = getDayRecord(cls, curDate, idx);
      const isPresent = (rec.status === 'present');
      const stInfo = stMap[rec.status] || stMap.present;
      const doneCnt = isPresent ? subjs.filter(sub => isHwDoneForDate(cls, curDate, idx, sub)).length : 0;
      const allDone = isPresent && (doneCnt === subjs.length);

      let actionChips = isPresent ? `
        <div class="chip ${rec.uniform ? 'c-uni-y' : 'c-uni-n'}" onclick="toggleUni(${idx})">${rec.uniform ? '👕 Формтой' : '❌ Формгүй'}</div>
        <div class="chip ${allDone ? 'c-hw-y' : 'c-hw-n'}" onclick="openHwModal(${idx})">📝 Д/Г: ${doneCnt}/${subjs.length}</div>
      ` : `<div class="chip c-zero">0</div>`;

      let extraTags = '';
      if (rec.lateMin > 0 || rec.skipHours > 0) {
        extraTags = `<div class="extra-badges">`;
        if (rec.lateMin > 0) extraTags += `<span class="mini-tag" style="background:#fef3c7;color:#d97706">⏱️ ${rec.lateMin} мин</span>`;
        if (rec.skipHours > 0) extraTags += `<span class="mini-tag" style="background:#ffe4e6;color:#e11d48">🏃 ${rec.skipHours} цаг</span>`;
        extraTags += `</div>`;
      }

      let leaveInput = (rec.status === 'leave' || rec.status === 'sick') ? `
        <input type="text" maxlength="40" placeholder="Шалтгаан бичих..." value="${rec.leaveReason || ''}" oninput="updateLeaveReason(${idx}, this.value)" style="width:100%; padding:8px 12px; border-radius:12px; border:1.5px dashed #cbd5e1; background:#f8fafc; font-size:11px; margin-top:8px;" ${isLocked ? 'disabled' : ''}>
      ` : '';

      const dotAction = (curUser.role === 'leader') ? `openLeaderTaslaltModal(${idx})` : `openStudentStatsModal(${idx})`;

      return `
        <div class="st-card">
          <div class="st-top">
            <div class="st-name-wrap">
              <div class="avatar">${s.name.slice(0,2).toUpperCase()}</div>
              <span>${idx + 1}. ${s.name}</span>
            </div>
            <div class="st-right">
              <button class="dots-btn" onclick="${dotAction}">⋮</button>
            </div>
          </div>
          <div class="chips">
            <div class="chip ${stInfo.cls}" onclick="cycleStatus(${idx})">${stInfo.lbl}</div>
            ${actionChips}
          </div>
          ${extraTags}
          ${leaveInput}
        </div>
      `;
    }).join('');

    studentsHtml = `
      <div>${studentRows}</div>
      ${isLocked ? `<div style="text-align:center; padding:12px; background:#fff1f2; color:#e11d48; border-radius:14px; font-size:12px; font-weight:800; margin-top:8px;">🔒 Түгжигдсэн</div>` : `<button class="btn btn-p" onclick="saveDB();notify('✅ Хадгалагдлаа!')">💾 Бүртгэл хадгалах</button>`}
    `;
  }

  return `
    ${renderDateSearchBox('att_date_inp')}
    <div class="card"><div class="title">📅 Гараг сонгох</div><div class="tabs">${dayTabsHtml}</div></div>
    ${studentsHtml}
  `;
}

let tempSkipHours = 0;

function openLeaderTaslaltModal(idx) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const rec = getDayRecord(cls, curDate, idx);
  tempSkipHours = rec.skipHours || 0;

  let lateOptionsHtml = `<option value="0" ${rec.lateMin === 0 ? 'selected' : ''}>Хоцроогүй (0 мин)</option>`;
  for (let m = 1; m <= 80; m++) {
    lateOptionsHtml += `<option value="${m}" ${rec.lateMin === m ? 'selected' : ''}>${m} минут</option>`;
  }

  let hourButtonsHtml = `<button type="button" id="hbtn_0" class="hour-btn ${tempSkipHours === 0 ? 'active-zero' : ''}" onclick="selectSkipHourBtn(0)">0 цаг</button>`;
  for (let h = 1; h <= 7; h++) {
    hourButtonsHtml += `<button type="button" id="hbtn_${h}" class="hour-btn ${tempSkipHours === h ? 'active-abs' : ''}" onclick="selectSkipHourBtn(${h})">${h} цаг</button>`;
  }

  openModal(`
    <div class="title"><span>📌 Хоцролт & Таслалт — ${st.name}</span><button class="btn btn-sm btn-g" onclick="closeModal()">✕</button></div>
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px;margin-bottom:10px">
      <label style="font-size:11px;font-weight:800;color:#b45309;display:block;margin-bottom:6px">⏱️ Хоцролт (1-80 мин):</label>
      <select id="ldr_late_select" style="margin-bottom:0;background:#fff">${lateOptionsHtml}</select>
    </div>
    <div style="background:#fff1f2;border:1px solid #fecdd3;border-radius:14px;padding:12px;margin-bottom:12px">
      <label style="font-size:11px;font-weight:800;color:#be123c;display:block;margin-bottom:6px">🏃 Дундаас таслалт (1-7 цаг):</label>
      <div class="hour-btn-grid">${hourButtonsHtml}</div>
    </div>
    <button class="btn btn-p" onclick="saveLeaderTaslaltModal(${idx})">💾 Хадгалах</button>
  `);
}

function selectSkipHourBtn(h) {
  tempSkipHours = h;
  for (let i = 0; i <= 7; i++) {
    const btn = document.getElementById('hbtn_' + i);
    if (!btn) continue;
    btn.className = 'hour-btn';
    if (i === h) btn.classList.add(h === 0 ? 'active-zero' : 'active-abs');
  }
}

function saveLeaderTaslaltModal(idx) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  rec.lateMin = parseInt(document.getElementById('ldr_late_select').value, 10) || 0;
  rec.skipHours = tempSkipHours;
  saveDB();
  closeModal();
  notify('✅ Хадгалагдлаа!');
  render();
}

function openStudentStatsModal(idx) {
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const pStats = getStudentPersonalStats(cls, idx);

  let histHtml = pStats.history.length === 0 ? `<div style="font-size:11px;color:var(--mut)">Түүх байхгүй</div>` : pStats.history.map(h => `<div style="padding:6px 10px;background:#f8fafc;border-radius:8px;font-size:11px;margin-bottom:4px;display:flex;justify-content:space-between"><span>${h.date}</span><span>${h.txt}</span></div>`).join('');

  openModal(`
    <div class="title"><span>👤 ${st.name}</span><button class="btn btn-sm btn-g" onclick="closeModal()">✕</button></div>
    <button class="btn btn-sm btn-p" style="width:100%;margin-bottom:12px" onclick="openLeaderTaslaltModal(${idx})">⏱️ Хоцролт & Таслалт засах</button>
    <div class="stat-grid">
      <div class="stat-pill"><div class="num" style="color:var(--err)">${pStats.absent}</div><div class="lbl">Тасалсан</div></div>
      <div class="stat-pill"><div class="num" style="color:var(--purp)">${pStats.midSkipHours}ц</div><div class="lbl">Дундаас</div></div>
      <div class="stat-pill"><div class="num" style="color:var(--warn)">${pStats.sick}</div><div class="lbl">Өвчтэй</div></div>
      <div class="stat-pill"><div class="num" style="color:var(--sec)">${pStats.noUni}</div><div class="lbl">Формгүй</div></div>
    </div>
    ${histHtml}
    <button class="btn btn-g" style="margin-top:12px" onclick="closeModal()">Хаах</button>
  `);
}

function cycleStatus(idx) {
  if (isEditLocked()) return;
  const order = ['present', 'absent', 'sick', 'leave'];
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  rec.status = order[(order.indexOf(rec.status) + 1) % order.length];
  saveDB(); render();
}

function toggleUni(idx) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  if (rec.status !== 'present') return;
  rec.uniform = !rec.uniform;
  saveDB(); render();
}

function openHwModal(idx) {
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const rec = getDayRecord(cls, curDate, idx);
  if (rec.status !== 'present') return notify('⚠️ Ирээгүй сурагч!');
  const subjs = cls.schedule[curDay] || [];
  if (subjs.length === 0) return notify('⚠️ Хуваарь байхгүй!');

  let subjsHtml = subjs.map(sub => {
    const done = isHwDoneForDate(cls, curDate, idx, sub);
    return `<div class="u-row"><span>${sub}</span><div><button class="btn btn-sm ${done?'btn-ok':'btn-g'}" onclick="setHw(${idx},'${sub}',true)">Тийм</button> <button class="btn btn-sm ${!done?'btn-err':'btn-g'}" onclick="setHw(${idx},'${sub}',false)">Үгүй</button></div></div>`;
  }).join('');

  openModal(`<div class="title"><span>📝 Даалгавар — ${st.name}</span><button class="btn btn-sm btn-g" onclick="closeModal()">✕</button></div>${subjsHtml}<button class="btn btn-p" style="margin-top:10px" onclick="closeModal()">Болсон</button>`);
}

function setHw(idx, sub, val) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  if (!rec.hw) rec.hw = {};
  rec.hw[sub] = val;
  saveDB(); openHwModal(idx); render();
}

render();
initFirebaseCloud();
</script>
</body>
</html>
