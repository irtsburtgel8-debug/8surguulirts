<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ухаалаг сургууль — Ирц бүртгэлийн систем</title>
<style>
  :root {
    --pri: #6366f1;
    --pri-light: #e0e7ff;
    --pri-d: #4338ca;
    --sec: #38bdf8;
    --ok: #10b981;
    --err: #f43f5e;
    --warn: #f59e0b;
    --purp: #a855f7;
    --bg: #f4f6fb;
    --card: #ffffff;
    --txt: #1e293b;
    --mut: #64748b;
    --soft-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.06), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
    --card-border: 1px solid rgba(255, 255, 255, 0.9);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #e2e8f0;
    display: flex;
    justify-content: center;
    color: var(--txt);
  }

  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    padding-bottom: 95px;
    overflow-x: hidden;
    box-shadow: 0 0 40px rgba(15, 23, 42, 0.1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hdr {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #a855f7 100%);
    color: #fff;
    padding: 24px 20px 34px;
    border-radius: 0 0 32px 32px;
    box-shadow: 0 12px 30px -8px rgba(99, 102, 241, 0.35);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .hdr-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hdr h1 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .badge {
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 6px 13px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    display: inline-block;
    margin-top: 10px;
  }
  .btn-out {
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #fff;
    padding: 7px 14px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-out:active { transform: scale(0.94); }

  .wrap {
    padding: 16px;
    margin-top: -20px;
    position: relative;
    z-index: 41;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: fadeIn 0.25s ease-out;
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 18px;
    box-shadow: var(--soft-shadow);
    border: var(--card-border);
  }
  .title {
    font-size: 14px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: -0.2px;
  }

  input, select, textarea {
    width: 100%;
    padding: 13px 15px;
    border-radius: 16px;
    border: 1.5px solid #e2e8f0;
    background: #f8fafc;
    font-size: 13px;
    color: var(--txt);
    margin-bottom: 10px;
    outline: none;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #818cf8;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn:active { transform: scale(0.96); }
  .btn-p {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.4);
  }
  .btn-ok {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.35);
  }
  .btn-err {
    background: #ffe4e6;
    color: #e11d48;
  }
  .btn-g {
    background: #f1f5f9;
    color: #475569;
  }
  .btn-sm {
    width: auto;
    padding: 7px 12px;
    font-size: 11px;
    border-radius: 12px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 5px;
    background: #e2e8f0;
    border-radius: 18px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 12px;
    border-radius: 14px;
    background: transparent;
    color: var(--mut);
    font-size: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }
  .tab.active {
    background: #ffffff;
    color: var(--pri-d);
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
  }

  .st-card {
    background: #ffffff;
    border-radius: 22px;
    padding: 15px;
    margin-bottom: 12px;
    border: var(--card-border);
    box-shadow: var(--soft-shadow);
    transition: transform 0.2s ease;
  }
  .st-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .st-name-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 14px;
    color: #0f172a;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    background: linear-gradient(135deg, #e0e7ff, #ede9fe);
    color: #4f46e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
  }
  .st-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-mini {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 10px;
    background: #f8fafc;
    color: var(--mut);
  }
  .dots-btn {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #475569;
    width: 32px;
    height: 32px;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .dots-btn:active {
    background: #e2e8f0;
    transform: scale(0.92);
  }

  .chips { display: flex; gap: 8px; }
  .chip {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    border: 1.5px solid transparent;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .chip:active { transform: scale(0.94); }
  .c-pres { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
  .c-abs { background: #fff1f2; color: #e11d48; border-color: #fecdd3; }
  .c-sick { background: #fffbeb; color: #d97706; border-color: #fde68a; }
  .c-leav { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
  .c-uni-y { background: #f0f9ff; color: #0284c7; border-color: #bae6fd; }
  .c-uni-n { background: #fff1f2; color: #e11d48; border-color: #fecdd3; }
  .c-hw-y { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; }
  .c-hw-n { background: #fff7ed; color: #ea580c; border-color: #fed7aa; }
  .c-zero { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; }

  .date-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .date-bar input { margin-bottom: 0; flex: 1; font-weight: 800; color: var(--pri-d); background: #fff; }

  .donuts-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .donuts-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: center; }
  .d-box {
    background: #f8fafc;
    padding: 12px 6px;
    border-radius: 18px;
    border: 1px solid #f1f5f9;
  }
  .d-lbl { font-size: 10px; font-weight: 800; color: var(--mut); margin-bottom: 6px; letter-spacing: 0.3px; }
  
  .bars {
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    height: 140px;
    padding: 20px 10px 6px;
    background: #f8fafc;
    border-radius: 18px;
    border: 1px solid #f1f5f9;
    gap: 8px;
  }
  .b-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
  .b-fill { width: 100%; max-width: 30px; border-radius: 10px 10px 4px 4px; min-height: 6px; transition: height 0.35s ease; }
  .b-val { font-size: 11px; font-weight: 800; margin-bottom: 4px; color: var(--txt); }
  .b-txt { font-size: 9px; font-weight: 700; color: var(--mut); margin-top: 6px; text-align: center; }

  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-pill { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 16px; padding: 12px; text-align: center; }
  .stat-pill .num { font-size: 19px; font-weight: 900; }
  .stat-pill .lbl { font-size: 11px; font-weight: 700; color: var(--mut); margin-top: 3px; }

  .modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 999;
    display: none;
    justify-content: center;
    align-items: flex-end;
  }
  .sheet {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    border-radius: 30px 30px 0 0;
    padding: 22px 20px;
    overflow-y: auto;
    box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.15);
    animation: fadeIn 0.2s ease-out;
  }
  .sheet-handle {
    width: 42px;
    height: 5px;
    background: #cbd5e1;
    border-radius: 10px;
    margin: -6px auto 14px;
  }
  .toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    z-index: 2000;
    display: none;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
    text-align: center;
    width: 88%;
    max-width: 380px;
  }
  .u-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 14px;
    background: #f8fafc;
    border-radius: 15px;
    margin-bottom: 8px;
    border-left: 4px solid var(--pri);
    font-size: 12px;
    transition: background 0.15s ease;
  }
  .arch-tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    margin-top: 8px;
  }
  .arch-tbl th, .arch-tbl td {
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px solid #f1f5f9;
  }
  .arch-tbl th {
    background: #f8fafc;
    color: var(--mut);
    font-weight: 800;
  }
  .arch-tbl td:first-child, .arch-tbl th:first-child {
    text-align: left;
    font-weight: 700;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// =========================================================
// 1. ОГНОО БА ЦАГИЙН ХЯЗГААРЛАЛТЫН ТООЦООЛОЛ
// =========================================================
let memDB = null;
const KEY = 'smart_school_pro_time_locked_v2';

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}

function parseDateStr(str) {
  const parts = str.split('.');
  return new Date(parts[0], parseInt(parts[1]) - 1, parts[2]).getTime();
}

function normalizeDate(str) {
  if (!str) return getTodayStr();
  const cleaned = str.trim().replace(/[-/]/g, '.');
  const parts = cleaned.split('.').map(x => parseInt(x, 10)).filter(x => !isNaN(x));
  if (parts.length === 3) return `${parts[0]}.${parts[1]}.${parts[2]}`;
  return cleaned;
}

function isEditLocked() {
  if (!curUser || (curUser.role !== 'teacher' && curUser.role !== 'leader')) return false;
  const curMs = parseDateStr(curDate);
  const todayMs = parseDateStr(getTodayStr());
  if (curMs < todayMs) {
    notify('⚠️ Өнгөрсөн өдрийн мэдээллийг засах боломжгүй зөвхөн харах эрхтэй!');
    return true;
  }
  return false;
}

function defaultData() {
  return {
    school: { name: '8-р сургууль', gmail: '8surmeneger@gmail.com' },
    users: [
      { u: '8surmeneger', p: '12345678', role: 'manager', cls: 'Бүгд', label: 'Сургуулийн Менежер' }
    ],
    classes: {}
  };
}

function loadDB() {
  try {
    const s = window.localStorage.getItem(KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  if (!memDB) memDB = defaultData();
  return memDB;
}
function saveDB() {
  try { window.localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
  memDB = db;
}

let db = loadDB();
let curUser = null;
let curTab = 'main';
let curDate = getTodayStr();
let curDay = new Date().getDay() || 1;
if (curDay > 5) curDay = 1;
let curClassFilter = '';
let curArchiveClass = 'Бүгд';
let curPeriod = '7d';

function notify(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2600);
}
function openModal(html) {
  document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + html;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }

function getDayRecord(clsObj, dateStr, stIdx) {
  const dKey = normalizeDate(dateStr);
  if (!clsObj.records) clsObj.records = {};
  if (!clsObj.records[dKey]) clsObj.records[dKey] = {};
  if (!clsObj.records[dKey][stIdx]) {
    clsObj.records[dKey][stIdx] = { status: 'present', uniform: true, hw: {}, leaveReason: '' };
  }
  return clsObj.records[dKey][stIdx];
}

function isHwDoneForDate(clsObj, dateStr, stIdx, subj) {
  const rec = getDayRecord(clsObj, dateStr, stIdx);
  if (rec.status !== 'present') return false; 
  if (!rec.hw) rec.hw = {};
  if (rec.hw[subj] === undefined) rec.hw[subj] = true;
  return rec.hw[subj];
}

function updateLeaveReason(idx, val) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  rec.leaveReason = val.substring(0, 40); 
  saveDB();
}

function getStudentPersonalStats(clsObj, stIdx) {
  let present = 0, absent = 0, leave = 0, sick = 0, noUni = 0, noHw = 0;
  const history = [];
  
  Object.keys(clsObj.records || {}).sort().reverse().forEach(dKey => {
    const r = clsObj.records[dKey][stIdx];
    if (!r) return;
    if (r.status === 'absent') {
      absent++;
      history.push({ date: dKey, txt: '❌ Тасалсан (Форм: 0, Д/Г: 0)' });
    } else if (r.status === 'leave') {
      leave++;
      const reasonTxt = r.leaveReason ? ` | Шалтгаан: ${r.leaveReason}` : '';
      history.push({ date: dKey, txt: `🏃 Чөлөөтэй (Форм: 0, Д/Г: 0)${reasonTxt}` });
    } else if (r.status === 'sick') {
      sick++;
      const reasonTxt = r.leaveReason ? ` | Шалтгаан: ${r.leaveReason}` : '';
      history.push({ date: dKey, txt: `🤒 Өвчтэй (Форм: 0, Д/Г: 0)${reasonTxt}` });
    } else if (r.status === 'present') {
      present++;
      if (!r.uniform) noUni++;
      const missedList = Object.keys(r.hw || {}).filter(k => r.hw[k] === false);
      if (missedList.length > 0) noHw++;
      history.push({
        date: dKey,
        txt: `✅ Ирсэн | ${r.uniform ? '👕 Формтой' : '❌ Формгүй'} | ${missedList.length === 0 ? 'Д/Г Бүрэн' : 'Д/Г Дутуу (' + missedList.join(', ') + ')'}`
      });
    }
  });

  return { present, absent, leave, sick, noUni, noHw, history };
}

function applyDateSearch(inputId) {
  const el = document.getElementById(inputId);
  if (!el || !el.value.trim()) return notify('⚠️ Он сар өдрөө бичнэ үү!');
  
  const searchDate = normalizeDate(el.value);
  const searchMs = parseDateStr(searchDate);
  const todayMs = parseDateStr(getTodayStr());

  if ((curUser.role === 'teacher' || curUser.role === 'leader') && searchMs > todayMs) {
    return notify('⚠️ Ирээдүйн огнооны бүртгэлийг урьдчилж оруулах боломжгүй!');
  }

  curDate = searchDate;
  const d = new Date(searchMs);
  const dow = d.getDay();
  if (dow >= 1 && dow <= 5) curDay = dow;

  saveDB();
  notify(`📅 ${curDate} өдрийн мэдээлэл гарлаа!`);
  render();
}

function renderDateSearchBox(inputId) {
  const isToday = parseDateStr(curDate) === parseDateStr(getTodayStr());
  return `
    <div class="card" style="background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-color:#e0e7ff">
      <div class="title" style="margin-bottom:8px;color:var(--pri-d)">
        <span>📅 Огноогоор харах</span>
        <span style="font-size:11px;background:#fff;padding:4px 10px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.04)">
          ${curDate} ${isToday ? '(Өнөөдөр)' : ''}
        </span>
      </div>
      <div class="date-bar">
        <input id="${inputId}" value="${curDate}" placeholder="Жнь: ${getTodayStr()}">
        <button class="btn btn-p" style="width:auto;padding:12px 16px" onclick="applyDateSearch('${inputId}')">🔍 Харах</button>
      </div>
      ${!isToday ? `<button class="btn btn-sm btn-g" style="margin-top:6px;width:100%" onclick="curDate=getTodayStr();render()">🔄 Өнөөдөр лүү буцах (${getTodayStr()})</button>` : ''}
    </div>
  `;
}

// =========================================================
// 2. ДЭЛГЭЦ ЗУРАХ ХЭСЭГ
// =========================================================
function render() {
  const app = document.getElementById('app');
  if (!curUser) { app.innerHTML = renderLogin(); return; }

  if (curUser.role === 'teacher' || curUser.role === 'leader') {
    curClassFilter = curUser.cls;
    curArchiveClass = curUser.cls;
  }

  let body = '';
  if (curUser.role === 'manager') body = renderManager();
  else if (curUser.role === 'social') body = renderSocial();
  else if (curUser.role === 'teacher') body = renderTeacher();
  else if (curUser.role === 'leader') body = renderLeader();

  app.innerHTML = `
    <div class="hdr">
      <div class="hdr-top">
        <h1>Ухаалаг сургууль</h1>
        <button class="btn-out" onclick="logout()">Гарах 🚪</button>
      </div>
      <div class="badge">👤 ${curUser.label} (${curUser.u}) • Анги: ${curUser.cls}</div>
    </div>
    <div class="wrap">${body}</div>
  `;
}

// =========================================================
// 3. НЭВТРЭХ ХЭСЭГ
// =========================================================
function renderLogin() {
  return `
    <div class="hdr" style="padding:38px 22px;">
      <h1>Ухаалаг сургууль</h1>
      <div class="badge">Ирц бүртгэлийн систем</div>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="title">🔐 Системд нэвтрэх</div>
        <label style="font-size:11px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px">Нэвтрэх нэр</label>
        <input id="l_user" placeholder="Нэвтрэх нэрээ оруулна уу" autocomplete="username">
        <label style="font-size:11px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px">Нууц үг</label>
        <input id="l_pass" type="password" placeholder="Нууц үгээ оруулна уу" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="btn btn-p" onclick="doLogin()">🚀 Нэвтрэх</button>
      </div>
    </div>
  `;
}

function doLogin() {
  const u = document.getElementById('l_user').value.trim();
  const p = document.getElementById('l_pass').value.trim();
  const found = db.users.find(x => x.u === u && x.p === p);
  if (!found) return notify('❌ Нэвтрэх нэр эсвэл нууц үг буруу байна!');
  
  curUser = found;
  if (found.cls !== 'Бүгд') {
    curClassFilter = found.cls;
    curArchiveClass = found.cls;
  } else {
    curArchiveClass = 'Бүгд';
  }
  curTab = 'main';
  
  curDate = getTodayStr();
  let dow = new Date().getDay();
  if (dow >= 1 && dow <= 5) curDay = dow;

  notify('✅ Тавтай морил, ' + found.label + '!');
  render();
}

function logout() { curUser = null; render(); }

function toggleClassInput() {

}

function createUser() {
  const role = document.getElementById('cu_role').value;
  const cls = role === 'social' ? 'Бүгд' : document.getElementById('cu_cls').value.trim().toUpperCase();
  const u = document.getElementById('cu_user').value.trim();
  const p = document.getElementById('cu_pass').value.trim();

  if (!u || !p || (role !== 'social' && !cls)) return notify('⚠️ Бүх талбарыг бөглөнө үү!');
  if (db.users.some(x => x.u === u)) return notify('❌ Энэ нэвтрэх нэр бүртгэлтэй байна!');

  if (role !== 'social' && !db.classes[cls]) {
    db.classes[cls] = {
      shift: 'Өглөө',
      schedule: { 1: [], 2: [], 3: [], 4: [], 5: [] },
      students: [],
      records: {}
    };
  }

  const roleNames = { social: 'Нийгмийн ажилтан', teacher: `${cls} Ангийн багш`, leader: `${cls} Ангийн дарга` };

  saveDB();
  notify(`✅ ${u} хаяг амжилттай үүслээ!`);
  render();

function changePassModal(idx) {

function saveNewPass(idx) {

function delUser(idx) {

// Excel (CSV) файл татах функц
function downloadArchiveCSV(targetCls) {
  const isTeacher = (curUser.role === 'teacher');
  const clsList = (targetCls === 'Бүгд') ? Object.keys(db.classes) : [targetCls];
  if (clsList.length === 0) return notify('⚠️ Татах анги алга байна!');

  let csv = '\uFEFF'; // Монгол үсэг Excel дээр таниулах UTF-8 BOM
  csv += 'Сургууль,Анги,Ээлж,Д/Д,Сурагчийн нэр,Ирсэн өдөр,Тасалсан,Чөлөөтэй,Өвчтэй,Формгүй' + (isTeacher ? ',Д/Г дутуу' : '') + ',Дэлгэрэнгүй түүх\n';

  clsList.forEach(cName => {
    const cObj = db.classes[cName];
    if (!cObj) return;
    cObj.students.forEach((st, idx) => {
      const s = getStudentPersonalStats(cObj, idx);
      const histStr = s.history.map(h => `${h.date}: ${h.txt}`).join(' || ').replace(/"/g, '""');
      const cleanName = st.name.replace(/"/g, '""');
      csv += `"${db.school.name}","${cName}","${cObj.shift || 'Өглөө'}",${idx + 1},"${cleanName}",${s.present},${s.absent},${s.leave},${s.sick},${s.noUni}${isTeacher ? ',' + s.noHw : ''},"${histStr}"\n`;
    });
  });

  try {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Arhiv_${targetCls}_${getTodayStr()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    notify(`✅ ${targetCls} ангийн Excel (CSV) архив татагдлаа!`);
  } catch (e) {
    openArchiveDetailModal(targetCls);
  }
}

// Дэлгэрэнгүй архив харах болон хуулах цонх
function openArchiveDetailModal(targetCls) {
  const clsList = (targetCls === 'Бүгд') ? Object.keys(db.classes) : [targetCls];
  let reportTxt = `=== ${db.school.name.toUpperCase()} - АРХИВ ТАЙЛАН (${getTodayStr()}) ===\n\n`;

  clsList.forEach(cName => {
    const cObj = db.classes[cName];
    if (!cObj) return;
    reportTxt += `🏫 АНГИ: ${cName} (${cObj.shift || 'Өглөө'} ээлж | Нийт ${cObj.students.length} сурагч)\n`;
    reportTxt += `--------------------------------------------------\n`;
    cObj.students.forEach((st, idx) => {
      const s = getStudentPersonalStats(cObj, idx);
      reportTxt += `${idx + 1}. ${st.name} -> Ирсэн: ${s.present} | Тасалсан: ${s.absent} | Чөлөө: ${s.leave} | Өвчтэй: ${s.sick} | Формгүй: ${s.noUni}\n`;
      s.history.forEach(h => {
        reportTxt += `   • [${h.date}] ${h.txt}\n`;
      });
    });
    reportTxt += `\n`;
  });

  openModal(`
    <div class="title">
      <span>📄 Архив тайлан (${targetCls})</span>
      <button class="btn btn-sm btn-g" onclick="closeModal()">✕</button>
    </div>
    <p style="font-size:11px;color:var(--mut);margin-bottom:8px">Доорх нэгдсэн архивыг хуулж авах эсвэл текст файлаар хадгалж болно:</p>
    <textarea id="arch_txt_area" style="height:220px;font-size:11px;line-height:1.5;font-family:monospace" readonly>${reportTxt}</textarea>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ok" onclick="copyArchiveText()">📋 Тайлан хуулах</button>
      <button class="btn btn-g" onclick="closeModal()">Хаах</button>
    </div>
  `);
}

function copyArchiveText() {
  const el = document.getElementById('arch_txt_area');
  if (!el) return;
  el.select();
  try {
    navigator.clipboard.writeText(el.value);
    notify('✅ Архив тайлан хуулагдлаа!');
  } catch (e) {
    document.execCommand('copy');
    notify('✅ Архив тайлан хуулагдлаа!');
  }
}

function svgDonut(pct, color) {
  const r = 24, c = 2 * Math.PI * r;
  const off = c - (pct / 100) * c;
  return `
    <svg width="68" height="68" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="6.5"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6.5"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 32 32)"/>
      <text x="50%" y="54%" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">${pct}%</text>
    </svg>
  `;
}

function renderSocialAnalytics() {
  const isClassLocked = (curUser.role === 'teacher' || curUser.role === 'leader');
  const showHw = (curUser.role === 'teacher' || curUser.role === 'leader');

  const clsList = Object.keys(db.classes);
  if (clsList.length === 0) {
    return `<div class="card"><div class="title">⚠️ Одоогоор анги үүсээгүй байна</div><p style="font-size:12px;color:var(--mut)">Менежер хаягаар орж ангийн багш эсвэл ангийн даргын хаяг нээнэ үү.</p></div>`;
  }

  if (isClassLocked) {
    curClassFilter = curUser.cls;
  } else if (!db.classes[curClassFilter]) {
    curClassFilter = clsList[0];
  }

  const clsObj = db.classes[curClassFilter];
  const sts = clsObj.students;
  const total = sts.length || 1;
  const subjs = (clsObj.schedule && clsObj.schedule[curDay]) ? clsObj.schedule[curDay] : [];

  let presCount = 0, uniCount = 0, hwDone = 0;
  const absList = [], leaveList = [], sickList = [], noUniList = [], noHwList = [];

  sts.forEach((s, idx) => {
    const rec = getDayRecord(clsObj, curDate, idx);
    if (rec.status === 'present') {
      presCount++;
      if (rec.uniform) uniCount++;
      else noUniList.push({ s, idx });

      let missedAny = false;
      subjs.forEach(sub => {
        if (isHwDoneForDate(clsObj, curDate, idx, sub)) hwDone++;
        else missedAny = true;
      });
      if (missedAny) noHwList.push({ s, idx });
    } else if (rec.status === 'absent') absList.push({ s, idx });
    else if (rec.status === 'leave') leaveList.push({ s, idx });
    else if (rec.status === 'sick') sickList.push({ s, idx });
  });

  const presentTotal = presCount || 1;
  const hwTotal = presCount * (subjs.length || 1);

  const attPct = sts.length ? Math.round((presCount / total) * 100) : 0;
  const uniPct = presCount ? Math.round((uniCount / presentTotal) * 100) : 0;
  const hwPct = (presCount && subjs.length) ? Math.round((hwDone / hwTotal) * 100) : 0;

  const mult = curPeriod === '7d' ? 1 : 4;
  let bAbs = 0, bLeave = 0, bSick = 0, bNoUni = 0, bNoHw = 0;
  sts.forEach((s, idx) => {
    const stStats = getStudentPersonalStats(clsObj, idx);
    bAbs += stStats.absent * mult;
    bLeave += stStats.leave * mult;
    bSick += stStats.sick * mult;
    bNoUni += stStats.noUni * mult;
    bNoHw += stStats.noHw * mult;
  });

  const barItems = [
    { lbl: 'Таслалт', val: bAbs, col: '#f43f5e' },
    { lbl: 'Чөлөө', val: bLeave, col: '#a855f7' },
    { lbl: 'Өвчтэй', val: bSick, col: '#f59e0b' },
    ...(showHw ? [{ lbl: 'Д/Г дутуу', val: bNoHw, col: '#6366f1' }] : []),
    { lbl: 'Формгүй', val: bNoUni, col: '#38bdf8' }
  ];
  const maxB = Math.max(...barItems.map(x => x.val), 5);

  let tabsHtml = clsList.map(c => {
    return `<button class="tab ${curClassFilter===c?'active':''}" onclick="curClassFilter='${c}';render()">${c} (${db.classes[c].students.length})</button>`;
  }).join('');

  let barsHtml = barItems.map(b => {
    return `
      <div class="b-col">
        <div class="b-val">${b.val}</div>
        <div class="b-fill" style="height:${Math.round((b.val/maxB)*90)}px;background:${b.col}"></div>
        <div class="b-txt">${b.lbl}</div>
      </div>
    `;
  }).join('');

  return `
    ${renderDateSearchBox('an_date_inp')}

    ${!isClassLocked ? `
      <div class="card">
        <div class="title">🏫 Анги сонгох</div>
        <div class="tabs">${tabsHtml}</div>
      </div>
    ` : ''}

    <div class="card">
      <div class="title">🎯 ${curDate} График (${curClassFilter} анги)</div>
      <div class="${showHw ? 'donuts-3' : 'donuts-2'}">
        <div class="d-box"><div class="d-lbl">📊 ИРЦ</div>${svgDonut(attPct, '#10b981')}<div style="font-size:10px;font-weight:700;margin-top:4px">${presCount}/${sts.length} ирсэн</div></div>
        <div class="d-box"><div class="d-lbl">👕 ФОРМ</div>${svgDonut(uniPct, '#38bdf8')}<div style="font-size:10px;font-weight:700;margin-top:4px">${uniCount}/${presCount} өмссөн</div></div>
        ${showHw ? `<div class="d-box"><div class="d-lbl">📝 ДААЛГАВАР</div>${svgDonut(hwPct, '#6366f1')}<div style="font-size:10px;font-weight:700;margin-top:4px">${hwDone}/${hwTotal} хийсэн</div></div>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="title">
        <span>📊 Баганан Статик (${curClassFilter})</span>
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm ${curPeriod==='7d'?'btn-p':'btn-g'}" onclick="curPeriod='7d';render()">7 хоног</button>
          <button class="btn btn-sm ${curPeriod==='1m'?'btn-p':'btn-g'}" onclick="curPeriod='1m';render()">1 сар</button>
        </div>
      </div>
      <div class="bars">${barsHtml}</div>
    </div>

    <div class="card">
      <div class="title">📋 ${curDate} өдрийн жагсаалт (${curClassFilter})</div>
      ${renderAlertGroup('❌ Тасалсан сурагчид', absList, '#f43f5e', clsObj)}
      ${renderAlertGroup('🏃 Чөлөөтэй сурагчид', leaveList, '#a855f7', clsObj)}
      ${renderAlertGroup('🤒 Өвчтэй сурагчид', sickList, '#f59e0b', clsObj)}
      ${renderAlertGroup('👕 Форм өмсөж ирээгүй', noUniList, '#38bdf8', clsObj)}
      ${showHw ? renderAlertGroup('📝 Гэрийн даалгавар дутуу', noHwList, '#6366f1', clsObj, subjs) : ''}
    </div>
  `;
}

function renderAlertGroup(title, list, color, clsObj, subjs = null) {
  let listHtml = '';
  if (list.length === 0) {
    listHtml = `<div style="font-size:11px;color:#059669;background:#ecfdf5;padding:8px 12px;border-radius:12px;font-weight:700">Зөрчилгүй ✅</div>`;
  } else {
    listHtml = list.map(item => {
      let extra = '';
      const rec = getDayRecord(clsObj, curDate, item.idx);
      if (subjs && subjs.length > 0 && rec.status === 'present') {
        const missed = subjs.filter(sub => !isHwDoneForDate(clsObj, curDate, item.idx, sub));
        if (missed.length > 0) {
          extra = ` <span style="color:var(--err);font-size:11px">(Дутуу: ${missed.join(', ')})</span>`;
        }
      }
      if ((rec.status === 'leave' || rec.status === 'sick') && rec.leaveReason) {
        const reasonCol = rec.status === 'sick' ? 'var(--warn)' : 'var(--purp)';
        extra += `<div style="color:${reasonCol};font-size:10px;margin-top:3px;">Шалтгаан: ${rec.leaveReason}</div>`;
      }
      return `<div style="padding:8px 12px;background:#f8fafc;border-left:3.5px solid ${color};border-radius:10px;font-size:12px;font-weight:700;margin-bottom:5px">${item.s.name}${extra}</div>`;
    }).join('');
  }

  return `
    <div style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:800;color:${color};margin-bottom:5px">${title} (${list.length})</div>
      ${listHtml}
    </div>
  `;
}

// =========================================================
// 7. АНГИЙН БАГШ БА АНГИЙН ДАРГА
// =========================================================
function renderTeacher() {
  const cls = db.classes[curUser.cls];
  return `
    <div class="tabs">
      <button class="tab ${curTab==='main'?'active':''}" onclick="curTab='main';render()">✅ Бүртгэл</button>
      <button class="tab ${curTab==='sched'?'active':''}" onclick="curTab='sched';render()">📅 Хуваарь</button>
      <button class="tab ${curTab==='stats'?'active':''}" onclick="curTab='stats';render()">📊 Тайлан</button>
      <button class="tab ${curTab==='archive'?'active':''}" onclick="curTab='archive';render()">📦 Архив</button>
    </div>
    ${curTab === 'main' ? renderAttendanceBoard(cls) : ''}
    ${curTab === 'sched' ? renderTeacherConfig(cls) : ''}
    ${curTab === 'stats' ? renderSocialAnalytics() : ''}
    ${curTab === 'archive' ? renderArchiveSection() : ''}
  `;
}

function renderLeader() {
  const cls = db.classes[curUser.cls];
  return `
    <div class="tabs">
      <button class="tab ${curTab==='main'?'active':''}" onclick="curTab='main';render()">✅ Ирц & Даалгавар</button>
      <button class="tab ${curTab==='stats'?'active':''}" onclick="curTab='stats';render()">📊 Тайлан</button>
    </div>
    ${curTab === 'main' ? renderAttendanceBoard(cls) : renderSocialAnalytics()}
  `;
}

function renderTeacherConfig(cls) {
  const dayNames = { 1:'Даваа', 2:'Мягмар', 3:'Лхагва', 4:'Пүрэв', 5:'Баасан' };
  if (!cls.schedule) cls.schedule = { 1:[], 2:[], 3:[], 4:[], 5:[] };

  let scheduleInputsHtml = [1,2,3,4,5].map(d => {
    let val = (cls.schedule[d]||[]).join(', ');
    return `
      <label style="font-size:11px;font-weight:800;color:var(--pri);display:block;margin-bottom:4px">${d} дахь өдөр (${dayNames[d]}):</label>
      <input id="sch_${d}" value="${val}" placeholder="Жишээ: Математик, Монгол хэл...">
    `;
  }).join('');

  return `
    <div class="card">
      <div class="title">👨‍🎓 ${curUser.cls} ангийн сурагч нэмэх (${cls.students.length})</div>
      <textarea id="t_names" rows="3" placeholder="Сурагчдын нэрсийг шинэ мөрөөр эсвэл таслалаар зааглан бичнэ үү..."></textarea>
      <button class="btn btn-ok" onclick="addClassStudents()">➕ Сурагчид нэмэх</button>
    </div>

    <div class="card">
      <div class="title">☀️/🌙 Ээлж & Хуваарь оруулах</div>
      <label style="font-size:11px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px">Хичээллэх ээлж сонгох:</label>
      <select id="t_shift" onchange="saveShift()">
        <option value="Өглөө" ${cls.shift==='Өглөө'?'selected':''}>☀️ Өглөөний ээлж</option>
        <option value="Орой" ${cls.shift==='Орой'?'selected':''}>🌙 Оройн ээлж</option>
      </select>
      <p style="font-size:11px;color:var(--mut);margin-bottom:10px">Өдөр бүрийн хичээлүүдийг таслалаар зааглаж бичнэ үү:</p>
      ${scheduleInputsHtml}
      <button class="btn btn-p" onclick="saveSchedule()">💾 Хичээлийн хуваарь хадгалах</button>
    </div>
  `;
}

function saveShift() {
  db.classes[curUser.cls].shift = document.getElementById('t_shift').value;
  saveDB(); notify('✅ Ээлж хадгалагдлаа!');
}

function saveSchedule() {
  const cls = db.classes[curUser.cls];
  if (!cls.schedule) cls.schedule = {};
  [1,2,3,4,5].forEach(d => {
    const val = document.getElementById('sch_' + d).value;
    cls.schedule[d] = val.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  });
  saveDB();
  notify('✅ 1-5 дахь өдрийн хичээлийн хуваарь хадгалагдлаа!');
  render();
}

function addClassStudents() {
  const raw = document.getElementById('t_names').value.trim();
  if (!raw) return notify('⚠️ Сурагчдын нэрсийг оруулна уу!');
  const names = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  const cls = db.classes[curUser.cls];
  names.forEach(n => cls.students.push({ name: n }));
  saveDB();
  notify(`✅ ${names.length} сурагч нэмэгдлээ!`);
  render();
}

function renderAttendanceBoard(cls) {
  const dayNames = { 1:'Даваа', 2:'Мягмар', 3:'Лхагва', 4:'Пүрэв', 5:'Баасан' };
  if (!cls.schedule) cls.schedule = { 1:[], 2:[], 3:[], 4:[], 5:[] };
  const subjs = cls.schedule[curDay] || [];

  const stMap = {
    present: { lbl: '✅ Ирсэн', cls: 'c-pres' },
    absent: { lbl: '❌ Тасалсан', cls: 'c-abs' },
    sick: { lbl: '🤒 Өвчтэй', cls: 'c-sick' },
    leave: { lbl: '🏃 Чөлөөтэй', cls: 'c-leav' }
  };

  let dayTabsHtml = [1,2,3,4,5].map(d => {
    return `<button class="tab ${curDay===d?'active':''}" onclick="curDay=${d};render()">${dayNames[d]}</button>`;
  }).join('');

  const isLocked = parseDateStr(curDate) < parseDateStr(getTodayStr());

  let studentsHtml = '';
  if (cls.students.length === 0) {
    studentsHtml = `
      <div class="card">
        <div class="title">👨‍🎓 Сурагчийн жагсаалт хоосон байна</div>
        <p style="font-size:12px;color:var(--mut);line-height:1.5">Анги удирдсан багш "📅 Хуваарь" цэсээр орж сурагчдын нэрс болон хичээлийн хуваарийг оруулна уу.</p>
      </div>
    `;
  } else {
    let studentRows = cls.students.map((s, idx) => {
      const rec = getDayRecord(cls, curDate, idx);
      const isPresent = (rec.status === 'present');
      const stInfo = stMap[rec.status] || stMap.present;
      const doneCnt = isPresent ? subjs.filter(sub => isHwDoneForDate(cls, curDate, idx, sub)).length : 0;
      const allDone = isPresent && (doneCnt === subjs.length);
      const initials = s.name.trim().slice(0, 2).toUpperCase();

      let actionChips = '';
      if (isPresent) {
        actionChips = `
          <div class="chip ${rec.uniform ? 'c-uni-y' : 'c-uni-n'}" onclick="toggleUni(${idx})">
            ${rec.uniform ? '👕 Формтой' : '❌ Формгүй'}
          </div>
          <div class="chip ${allDone ? 'c-hw-y' : 'c-hw-n'}" onclick="openHwModal(${idx})">
            📝 Д/Г: ${doneCnt}/${subjs.length}
          </div>
        `;
      } else {
        actionChips = `
          <div class="chip c-zero" onclick="notify('⚠️ Ирээгүй сурагчийн форм 0 байна!')">👕 Форм: 0</div>
          <div class="chip c-zero" onclick="notify('⚠️ Ирээгүй сурагчийн даалгавар 0 байна!')">📝 Д/Г: 0</div>
        `;
      }

      let leaveInput = '';
      if (rec.status === 'leave' || rec.status === 'sick') {
        const isSick = rec.status === 'sick';
        const brColor = isSick ? '#fbbf24' : '#c084fc';
        const bgCol = isSick ? '#fffbeb' : '#faf5ff';
        const plc = isSick ? '🤒 Өвчний шалтгаан бичих (макс 40 үсэг)...' : '🏃 Чөлөөний шалтгаан бичих (макс 40 үсэг)...';
        leaveInput = `<input type="text" maxlength="40" placeholder="${plc}" value="${rec.leaveReason || ''}" oninput="updateLeaveReason(${idx}, this.value)" style="width:100%; padding:10px 14px; border-radius:14px; border:1.5px dashed ${brColor}; background:${bgCol}; font-size:11px; margin-top:10px; margin-bottom:0; outline:none; font-weight:700; color:var(--txt);" ${isLocked ? 'disabled' : ''}>`;
      }

      return `
        <div class="st-card">
          <div class="st-top">
            <div class="st-name-wrap">
              <div class="avatar">${initials}</div>
              <span>${idx + 1}. ${s.name}</span>
            </div>
            <div class="st-right">
              <span class="status-mini">
                ${!isPresent ? 'Хоосон (0) ⚪' : (allDone ? 'Д/Г Бүрэн ✅' : 'Д/Г Дутуу ⚠️')}
              </span>
              <button class="dots-btn" title="Сурагчийн хувийн мэдээлэл" onclick="openStudentStatsModal(${idx})">⋮</button>
            </div>
          </div>
          <div class="chips">
            <div class="chip ${stInfo.cls}" onclick="cycleStatus(${idx})">${stInfo.lbl}</div>
            ${actionChips}
          </div>
          ${leaveInput}
        </div>
      `;
    }).join('');

    studentsHtml = `
      <div>${studentRows}</div>
      ${isLocked ? 
        `<div style="text-align:center; padding:14px; background:#fff1f2; color:#e11d48; border-radius:16px; font-size:12px; font-weight:800; margin-top:8px; border:1px solid #fecdd3;">🔒 Өнгөрсөн өдрийн мэдээллийг өөрчлөх боломжгүй (Зөвхөн харах).</div>` 
        : 
        `<button class="btn btn-p" onclick="saveDB();notify('✅ ${curDate} өдрийн бүртгэл амжилттай хадгалагдлаа!')">💾 ${curDate} Бүртгэл хадгалах</button>`
      }
    `;
  }

  return `
    ${renderDateSearchBox('att_date_inp')}
    <div class="card">
      <div class="title">
        <span>📅 Гараг сонгох (${cls.shift || 'Өглөө'} ээлж)</span>
      </div>
      <div class="tabs">${dayTabsHtml}</div>
      <div style="font-size:11px;color:var(--mut);margin-top:10px;font-weight:700">
        📚 Хичээлүүд: <span style="color:var(--pri)">${subjs.length ? subjs.join(', ') : 'Хуваарь оруулаагүй байна'}</span>
      </div>
    </div>
    ${studentsHtml}
  `;
}

function openStudentStatsModal(idx) {
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const pStats = getStudentPersonalStats(cls, idx);

  let histHtml = '';
  if (pStats.history.length === 0) {
    histHtml = `<div style="font-size:11px;color:var(--mut);padding:10px 0">Одоогоор түүх бүртгэгдээгүй байна.</div>`;
  } else {
    histHtml = pStats.history.map(h => `
      <div style="padding:9px 12px;background:#f8fafc;border-radius:12px;font-size:11px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px">
        <span style="color:var(--pri);white-space:nowrap">${h.date}</span>
        <span style="text-align:right">${h.txt}</span>
      </div>
    `).join('');
  }

  openModal(`
    <div class="title">
      <span>👤 ${st.name} (${curUser.cls})</span>
      <button class="btn btn-sm btn-g" onclick="closeModal()">✕</button>
    </div>
    <div class="stat-grid">
      <div class="stat-pill" style="border-left:4px solid var(--err)">
        <div class="num" style="color:var(--err)">${pStats.absent}</div>
        <div class="lbl">❌ Тасалсан</div>
      </div>
      <div class="stat-pill" style="border-left:4px solid var(--purp)">
        <div class="num" style="color:var(--purp)">${pStats.leave}</div>
        <div class="lbl">🏃 Чөлөөтэй</div>
      </div>
      <div class="stat-pill" style="border-left:4px solid var(--warn)">
        <div class="num" style="color:var(--warn)">${pStats.sick}</div>
        <div class="lbl">🤒 Өвчтэй</div>
      </div>
      <div class="stat-pill" style="border-left:4px solid var(--sec)">
        <div class="num" style="color:var(--sec)">${pStats.noUni}</div>
        <div class="lbl">👕 Формгүй</div>
      </div>
    </div>
    <div class="u-row" style="border-left-color:var(--pri);margin-bottom:14px">
      <span>📝 Гэрийн даалгавар дутуу хийсэн:</span>
      <b style="color:var(--pri)">${pStats.noHw} удаа</b>
    </div>
    <div style="font-size:12px;font-weight:800;margin-bottom:8px">📅 Бүртгэгдсэн өдрүүдийн түүх:</div>
    ${histHtml}
    <button class="btn btn-p" style="margin-top:12px" onclick="closeModal()">✅ Хаах</button>
  `);
}

function cycleStatus(idx) {
  if (isEditLocked()) return;
  const order = ['present', 'absent', 'sick', 'leave'];
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  const nextStatus = order[(order.indexOf(rec.status) + 1) % order.length];
  rec.status = nextStatus;

  if (nextStatus !== 'present') {
    rec.uniform = false;
    rec.hw = {};
    (cls.schedule[curDay] || []).forEach(sub => { rec.hw[sub] = false; });
  } else {
    rec.uniform = true;
    rec.hw = {};
    (cls.schedule[curDay] || []).forEach(sub => { rec.hw[sub] = true; });
  }
  saveDB(); render();
}

function toggleUni(idx) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  if (rec.status !== 'present') return;
  rec.uniform = !rec.uniform;
  saveDB(); render();
}

function openHwModal(idx) {
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const rec = getDayRecord(cls, curDate, idx);
  if (rec.status !== 'present') return notify('⚠️ Ирээгүй сурагчийн даалгавар 0 (хоосон) байна!');

  const subjs = (cls.schedule && cls.schedule[curDay]) ? cls.schedule[curDay] : [];
  if (subjs.length === 0) {
    return notify('⚠️ Багш энэ өдрийн хичээлийн хуваарийг оруулаагүй байна!');
  }

  const isLocked = parseDateStr(curDate) < parseDateStr(getTodayStr());

  let subjsHtml = subjs.map(sub => {
    const done = isHwDoneForDate(cls, curDate, idx, sub);
    let btnsHtml = '';
    
    if (isLocked) {
      btnsHtml = `<span style="font-size:11px;font-weight:700;color:${done ? 'var(--ok)' : 'var(--err)'}">${done ? 'Хийсэн ✓' : 'Хийгээгүй ✗'}</span>`;
    } else {
      btnsHtml = `
        <button class="btn btn-sm ${done ? 'btn-ok' : 'btn-g'}" onclick="setHw(${idx},'${sub}',true)">Хийсэн ✓</button>
        <button class="btn btn-sm ${!done ? 'btn-err' : 'btn-g'}" onclick="setHw(${idx},'${sub}',false)">Хийгээгүй ✗</button>
      `;
    }

    return `
      <div class="u-row" style="border-left-color:${done ? 'var(--ok)' : 'var(--err)'}">
        <span style="font-weight:800;font-size:13px">${sub}</span>
        <div style="display:flex;gap:6px;align-items:center;">
          ${btnsHtml}
        </div>
      </div>
    `;
  }).join('');

  openModal(`
    <div class="title">
      <span>📝 ${st.name} (${curDate})</span>
      <button class="btn btn-sm btn-g" onclick="closeModal()">✕</button>
    </div>
    ${isLocked ? `<p style="font-size:11px;color:var(--err);margin-bottom:10px;font-weight:700;">🔒 Өнгөрсөн өдрийн мэдээллийг засах боломжгүй.</p>` : `<p style="font-size:11px;color:var(--mut);margin-bottom:10px">Автоматаар бүгд <b>"Хийсэн"</b> байгаа. Хийгээгүй хичээлийг дарж өөрчилнө үү:</p>`}
    ${subjsHtml}
    <button class="btn btn-p" style="margin-top:10px" onclick="closeModal()">✅ Болсон</button>
  `);
}

function setHw(idx, sub, val) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  if (!rec.hw) rec.hw = {};
  rec.hw[sub] = val;
  saveDB(); openHwModal(idx); render();
}

render();
</script>
</body>
</html>
