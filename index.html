<script>
// =========================================================
// 1. FIREBASE CLOUD REALTIME DB ТОХИРГОО (8-Р СУРГУУЛЬ)
// =========================================================
const FB_URL = 'https://surguul-5405b-default-rtdb.firebaseio.com';
const FB_REST_ENDPOINT = `${FB_URL}/smart_school_v1.json`;
const KEY = 'smart_school_8_v5';

let memDB = null;
let cloudRef = null;
let cloudStatus = '⏳ Холбогдож байна...';
let isApplyingRemote = false;
let saveTimer = null;

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}

function parseDateStr(str) {
  const parts = String(str || '').split('.');
  if (parts.length < 3) return 0;
  return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)).getTime();
}

function normalizeDate(str) {
  if (!str) return getTodayStr();
  const cleaned = str.trim().replace(/[-/]/g, '.');
  const parts = cleaned.split('.').map(x => parseInt(x, 10)).filter(x => !isNaN(x));
  if (parts.length === 3) return `${parts[0]}.${parts[1]}.${parts[2]}`;
  return cleaned;
}

// Энэ 7 хоногийн Даваа гарагийн огноог олох (Даваа гарагт дата цэвэрлэхэд ашиглана)
function getCurrentWeekMondayStr() {
  const now = new Date();
  const day = now.getDay(); // 0 = Ням, 1 = Даваа ... 6 = Бямба
  const diff = (day === 0 ? -6 : 1 - day);
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return `${mon.getFullYear()}.${mon.getMonth() + 1}.${mon.getDate()}`;
}

function getSortedClassList() {
  return Object.keys(db.classes || {}).sort((a, b) => a.localeCompare(b, 'mn', { numeric: true }));
}

function defaultData() {
  return {
    lastWeeklyResetMonday: getCurrentWeekMondayStr(),
    lastLateResetDate: getTodayStr(),
    users: [
      { u: 'manager', p: '1234', role: 'manager', cls: 'Бүгд', label: 'Сургуулийн Менежер' },
      { u: 'social', p: '1234', role: 'social', cls: 'Бүгд', label: 'Нийгмийн Ажилтан' }
    ],
    classes: {}
  };
}

function ensureStructure(data) {
  if (!data || typeof data !== 'object') return defaultData();
  if (!Array.isArray(data.users)) data.users = defaultData().users;
  if (!data.classes || typeof data.classes !== 'object') data.classes = {};
  if (!data.lastWeeklyResetMonday) data.lastWeeklyResetMonday = getCurrentWeekMondayStr();
  if (!data.lastLateResetDate) data.lastLateResetDate = getTodayStr();

  Object.keys(data.classes).forEach(k => {
    const c = data.classes[k];
    if (!c.shift) c.shift = 'Өглөө';
    if (!c.schedule) c.schedule = { 1: [], 2: [], 3: [], 4: [], 5: [] };
    for (let d = 1; d <= 5; d++) {
      if (!Array.isArray(c.schedule[d])) c.schedule[d] = [];
    }
    if (!Array.isArray(c.students)) c.students = [];
    if (!c.records || typeof c.records !== 'object') c.records = {};
  });
  return data;
}

// =========================================================
// АВТОМАТ УСТГАЛТЫН ЛОГИК (ДАВАА ГАРАГ БҮР + ШӨНИЙН 00:00 ЦАГТ)
// =========================================================
function checkAndRunAutoResets(shouldSave = true) {
  if (!db || !db.classes) return;
  let changed = false;

  const todayStr = getTodayStr();
  const curMondayStr = getCurrentWeekMondayStr();
  const curMondayMs = parseDateStr(curMondayStr);

  // 1. Хоцролтын 24 цагийн самбар: Шөнийн 00:00 цагт өмнөх өдрийн хоцролтын датаг устгаж 00:01-ээс шинээр авна
  if (db.lastLateResetDate !== todayStr) {
    Object.keys(db.classes).forEach(cName => {
      const recs = db.classes[cName].records || {};
      Object.keys(recs).forEach(dKey => {
        if (dKey !== todayStr) {
          Object.keys(recs[dKey] || {}).forEach(stIdx => {
            if (recs[dKey][stIdx] && recs[dKey][stIdx].lateMin) {
              recs[dKey][stIdx].lateMin = 0;
            }
          });
        }
      });
    });
    db.lastLateResetDate = todayStr;
    changed = true;
  }

  // Өнөөдрөөс өмнөх өдрүүдийн lateMin үлдсэн байвал цэвэрлэх
  Object.keys(db.classes).forEach(cName => {
    const recs = db.classes[cName].records || {};
    Object.keys(recs).forEach(dKey => {
      if (dKey !== todayStr) {
        Object.keys(recs[dKey] || {}).forEach(stIdx => {
          if (recs[dKey][stIdx] && recs[dKey][stIdx].lateMin > 0) {
            recs[dKey][stIdx].lateMin = 0;
            changed = true;
          }
        });
      }
    });
  });

  // 2. Долоо хоногийн 3 самбар: 1 дэх өдөр (Даваа гараг) бүр өмнөх 7 хоногийн датаг датабаазаас устгана
  if (db.lastWeeklyResetMonday !== curMondayStr) {
    Object.keys(db.classes).forEach(cName => {
      const recs = db.classes[cName].records || {};
      Object.keys(recs).forEach(dKey => {
        if (parseDateStr(dKey) < curMondayMs) {
          delete recs[dKey];
        }
      });
    });
    db.lastWeeklyResetMonday = curMondayStr;
    changed = true;
  }

  if (changed && shouldSave) {
    saveDB();
  }
}

function loadDB() {
  try {
    const s = window.localStorage.getItem(KEY);
    if (s) return ensureStructure(JSON.parse(s));
  } catch(e) {}
  if (!memDB) memDB = defaultData();
  return memDB;
}

function saveLocalOnly() {
  try { window.localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
  memDB = db;
}

function pushToCloud() {
  if (isApplyingRemote) return;
  const payloadObj = {
    payload: JSON.stringify(db),
    updatedAt: Date.now()
  };

  if (cloudRef) {
    cloudRef.set(payloadObj).then(() => {
      cloudStatus = '☁️ Онлайн';
      updateCloudBadge();
    }).catch(() => {
      pushViaRest(payloadObj);
    });
  } else {
    pushViaRest(payloadObj);
  }
}

function pushViaRest(payloadObj) {
  fetch(FB_REST_ENDPOINT, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payloadObj)
  }).then(r => {
    if (r.ok) {
      cloudStatus = '☁️ Онлайн';
      updateCloudBadge();
    }
  }).catch(() => {
    cloudStatus = '⚠️ Офлайн';
    updateCloudBadge();
  });
}

function saveDB(debounce = false) {
  saveLocalOnly();
  if (debounce) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => pushToCloud(), 450);
  } else {
    pushToCloud();
  }
}

function applyIncomingCloudData(val) {
  if (!val || !val.payload) {
    pushToCloud();
    cloudStatus = '☁️ Онлайн';
    updateCloudBadge();
    return;
  }
  try {
    const parsed = ensureStructure(JSON.parse(val.payload));
    isApplyingRemote = true;
    db = parsed;
    checkAndRunAutoResets(false);

    if (curUser) {
      const updatedMe = db.users.find(x => x.u === curUser.u);
      if (updatedMe) curUser = updatedMe;
    }

    saveLocalOnly();
    isApplyingRemote = false;
    cloudStatus = '☁️ Онлайн';

    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    const isModalOpen = document.getElementById('modal').style.display === 'flex';
    if (!isModalOpen && activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
      render();
    } else {
      updateCloudBadge();
    }
  } catch (e) {}
}

function manualSyncCloud() {
  cloudStatus = '🔄 Шинэчилж байна...';
  updateCloudBadge();
  fetch(FB_REST_ENDPOINT)
    .then(r => r.json())
    .then(data => {
      if (data && data.payload) {
        applyIncomingCloudData(data);
        notify('☁️ Бүх төхөөрөмжийн мэдээлэл шинэчлэгдлээ!');
      } else {
        pushToCloud();
        notify('☁️ Мэдээлэл үүлэн санах ойд хадгалагдлаа!');
      }
    })
    .catch(() => {
      cloudStatus = '⚠️ Офлайн';
      updateCloudBadge();
      notify('⚠️ Интернэт холболтоо шалгана уу!');
    });
}

function initFirebaseCloud() {
  fetch(FB_REST_ENDPOINT)
    .then(r => r.json())
    .then(data => {
      applyIncomingCloudData(data);
    })
    .catch(() => {
      cloudStatus = '⚠️ Офлайн';
      updateCloudBadge();
    });

  try {
    if (typeof firebase !== 'undefined') {
      if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: FB_URL });
      }
      cloudRef = firebase.database().ref('smart_school_v1');
      cloudRef.on('value', snapshot => {
        const val = snapshot.val();
        if (val) applyIncomingCloudData(val);
      });
    }
  } catch (e) {}
}

function getDayRecord(clsObj, dateStr, stIdx) {
  const dKey = normalizeDate(dateStr);
  if (!clsObj.records) clsObj.records = {};
  if (!clsObj.records[dKey]) clsObj.records[dKey] = {};
  if (!clsObj.records[dKey][stIdx]) {
    clsObj.records[dKey][stIdx] = {
      status: 'present',
      uniform: true,
      hw: {},
      leaveReason: '',
      lateMin: 0,
      skipHours: 0
    };
  }
  if (clsObj.records[dKey][stIdx].lateMin === undefined) clsObj.records[dKey][stIdx].lateMin = 0;
  if (clsObj.records[dKey][stIdx].skipHours === undefined) clsObj.records[dKey][stIdx].skipHours = 0;
  return clsObj.records[dKey][stIdx];
}

function isHwDoneForDate(clsObj, dateStr, stIdx, subj) {
  const rec = getDayRecord(clsObj, dateStr, stIdx);
  if (rec.status !== 'present') return false; 
  if (!rec.hw) rec.hw = {};
  if (rec.hw[subj] === undefined) rec.hw[subj] = true;
  return rec.hw[subj];
}

function updateLeaveReason(idx, val) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  rec.leaveReason = val.substring(0, 40); 
  saveDB(true);
}

function getStudentPersonalStats(clsObj, stIdx) {
  let present = 0, absent = 0, leave = 0, sick = 0, noUni = 0, noHw = 0, midSkipCnt = 0, midSkipHours = 0;
  const history = [];
  
  Object.keys(clsObj.records || {}).sort().reverse().forEach(dKey => {
    const r = clsObj.records[dKey][stIdx];
    if (!r) return;
    if (r.skipHours > 0) {
      midSkipCnt++;
      midSkipHours += r.skipHours;
    }
    if (r.status === 'absent') {
      absent++;
      history.push({ date: dKey, txt: `❌ Бүтэн тасалсан${r.skipHours ? ' (' + r.skipHours + ' цаг)' : ''}` });
    } else if (r.status === 'leave') {
      leave++;
      const reasonTxt = r.leaveReason ? ` | Шалтгаан: ${r.leaveReason}` : '';
      history.push({ date: dKey, txt: `🏃 Чөлөөтэй${reasonTxt}` });
    } else if (r.status === 'sick') {
      sick++;
      const reasonTxt = r.leaveReason ? ` | Шалтгаан: ${r.leaveReason}` : '';
      history.push({ date: dKey, txt: `🤒 Өвчтэй${reasonTxt}` });
    } else if (r.status === 'present') {
      present++;
      if (!r.uniform) noUni++;
      const missedList = Object.keys(r.hw || {}).filter(k => r.hw[k] === false);
      if (missedList.length > 0) noHw++;
      const extra lateOrSkip = [
        r.lateMin > 0 ? `⏱️ Хоцролт: ${r.lateMin}м` : '',
        r.skipHours > 0 ? `🏃 Дундаас тасалсан: ${r.skipHours} цаг` : ''
      ].filter(Boolean).join(' | ');
      history.push({
        date: dKey,
        txt: `✅ Ирсэн | ${r.uniform ? '👕 Формтой' : '❌ Формгүй'} | ${missedList.length === 0 ? 'Д/Г Бүрэн' : 'Д/Г Дутуу'}${lateOrSkip ? ' | ' + lateOrSkip : ''}`
      });
    }
  });

  return { present, absent, leave, sick, noUni, noHw, midSkipCnt, midSkipHours, history };
}

// Бүх ангийн хэмжээнд 4 самбарын датаг тооцоолох функц
function computeAllDashboardsData() {
  const curMondayStr = getCurrentWeekMondayStr();
  const curMondayMs = parseDateStr(curMondayStr);
  const todayStr = getTodayStr();

  const fullAbsentList = [];   // 1. Хичээл бүтэн таслалт (7 хоногоор)
  const midSkipList = [];      // 2. Хичээлийн дундаас таслалт 1-7 цаг (7 хоногоор)
  const noUniformList = [];    // 3. Формгүй ирсэн хүүхдүүд (7 хоногоор)
  const dailyLateList = [];    // 4. Хоцролтын самбар (24 цагаар - өнөөдрийнх)

  const clsKeys = getSortedClassList();

  clsKeys.forEach(cName => {
    const cObj = db.classes[cName];
    if (!cObj || !Array.isArray(cObj.students)) return;

    cObj.students.forEach((st, idx) => {
      let fullAbsCnt = 0;
      let midSkipTimes = 0;
      let midSkipTotalHours = 0;
      let noUniCnt = 0;

      // 7 хоногийн датаг шүүх (Даваа гарагаас хойш)
      Object.keys(cObj.records || {}).forEach(dKey => {
        if (parseDateStr(dKey) >= curMondayMs) {
          const r = cObj.records[dKey][idx];
          if (!r) return;
          if (r.status === 'absent') {
            fullAbsCnt++;
          }
          if (r.skipHours && r.skipHours > 0) {
            midSkipTimes++;
            midSkipTotalHours += r.skipHours;
          }
          if (r.status === 'present' && r.uniform === false) {
            noUniCnt++;
          }
        }
      });

      if (fullAbsCnt > 0) {
        fullAbsentList.push({ name: st.name, cls: cName, count: fullAbsCnt });
      }
      if (midSkipTotalHours > 0) {
        midSkipList.push({ name: st.name, cls: cName, times: midSkipTimes, hours: midSkipTotalHours });
      }
      if (noUniCnt > 0) {
        noUniformList.push({ name: st.name, cls: cName, count: noUniCnt });
      }

      // 4-р самбар: Өнөөдрийн (24 цагийн) хоцролт
      const todayRec = (cObj.records && cObj.records[todayStr]) ? cObj.records[todayStr][idx] : null;
      if (todayRec && todayRec.lateMin && todayRec.lateMin > 0) {
        dailyLateList.push({ name: st.name, cls: cName, lateMin: todayRec.lateMin });
      }
    });
  });

  // Хамгийн их зөрчилтэйгээр нь буурахаар эрэмбэлэх
  fullAbsentList.sort((a, b) => b.count - a.count);
  midSkipList.sort((a, b) => b.hours - a.hours || b.times - a.times);
  noUniformList.sort((a, b) => b.count - a.count);
  dailyLateList.sort((a, b) => b.lateMin - a.lateMin);

  return { fullAbsentList, midSkipList, noUniformList, dailyLateList, curMondayStr, todayStr };
}

function executeWeeklyDashboardCSV(boardType) {
  const { fullAbsentList, midSkipList, noUniformList, curMondayStr } = computeAllDashboardsData();
  let csv = '\uFEFF';
  csv += `Самбарын төрөл,Эрэмбэ,Сурагчийн нэр,Анги,Үзүүлэлт,7 хоног эхэлсэн огноо\n`;

  if (boardType === 'all' || boardType === 'board1') {
    fullAbsentList.forEach((x, idx) => {
      csv += `"1. Хичээл бүтэн таслалт",${idx + 1},"${x.name}","${x.cls}","Таслалт ${x.count} удаа","${curMondayStr}"\n`;
    });
  }
  if (boardType === 'all' || boardType === 'board2') {
    midSkipList.forEach((x, idx) => {
      csv += `"2. Хичээлийн дундаас таслалт (1-7 цаг)",${idx + 1},"${x.name}","${x.cls}","Таслалт ${x.hours} цаг (${x.times} удаа)","${curMondayStr}"\n`;
    });
  }
  if (boardType === 'all' || boardType === 'board3') {
    noUniformList.forEach((x, idx) => {
      csv += `"3. Формгүй ирсэн хүүхдүүд",${idx + 1},"${x.name}","${x.cls}","Формгүй ${x.count} удаа","${curMondayStr}"\n`;
    });
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Dashboard_7honog_${boardType}_${getTodayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  notify('✅ Сонгосон самбарын мэдээлэл Excel (CSV) файлаар татагдлаа!');
}

function downloadDailyLateCSV() {
  const { dailyLateList, todayStr } = computeAllDashboardsData();

    csv += `${idx + 1},"${x.name}","${x.cls}","${x.lateMin} минут","${todayStr}"\n`;

            <td>${idx + 1}. ${st.name}</td>
            <td style="color:var(--ok);font-weight:700">${stStats.present}</td>
            <td style="color:var(--err);font-weight:700">${stStats.absent}</td>

            <td style="color:var(--warn);font-weight:700">${stStats.sick}</td>
            <td style="color:var(--sec);font-weight:700">${stStats.noUni}</td>
            ${isTeacher ? `<td style="color:var(--pri);font-weight:700">${stStats.noHw}</td>` : ''}
          </tr>
        `;
      }).join('');

      rowsHtml = `
        <div style="overflow-x:auto">
          <table class="arch-tbl">
            <thead>
              <tr>
                <th>Сурагчийн нэр</th>
                <th>Ирсэн</th>
                <th>Бүтэн тас</th>
                <th>Дундаас тас</th>
                <th>Өвч</th>
                <th>Формгүй</th>
                ${isTeacher ? '<th>Д/Г дутуу</th>' : ''}
              </tr>
            </thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      `;
    }

    return `
      <div class="card">
        <div class="title">
          <span>📋 ${cName} ангийн нэгдсэн архив</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11px;color:var(--mut)">Бүртгэсэн: ${recDates.length} өдөр</span>
            ${isManager ? `<button class="btn btn-sm btn-err" onclick="askDeleteClassModal('${cName}')">🗑️ Устгах</button>` : ''}
          </div>
        </div>
        <div style="font-size:11px;color:var(--mut);margin-bottom:8px">
          Ээлж: <b>${cObj.shift || 'Өглөө'}</b> • Нийт сурагч: <b>${(cObj.students||[]).length}</b>
        </div>
        ${rowsHtml}
      </div>
    `;
  }).join('');

  return `
    ${selectorHtml}
    <div class="card" style="background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-color:#e0e7ff">
      <div class="title" style="color:var(--pri-d)">📥 Архив файл татах (${curArchiveClass})</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-ok" onclick="downloadArchiveCSV('${curArchiveClass}')">📊 Excel (CSV) архив татах</button>
      </div>
    </div>
    ${classCardsHtml}

}

function downloadArchiveCSV(targetCls) {
  const isTeacher = (curUser.role === 'teacher');
  const clsList = (targetCls === 'Бүгд') ? getSortedClassList() : [targetCls];
  if (clsList.length === 0) return notify('⚠️ Татах анги алга байна!');

  let csv = '\uFEFF';
  csv += 'Анги,Ээлж,Д/Д,Сурагчийн нэр,Ирсэн өдөр,Бүтэн тасалсан,Дундаас тасалсан (цаг),Чөлөөтэй,Өвчтэй,Формгүй' + (isTeacher ? ',Д/Г дутуу' : '') + ',Дэлгэрэнгүй түүх\n';

  clsList.forEach(cName => {
    const cObj = db.classes[cName];
    if (!cObj || !cObj.students) return;
    cObj.students.forEach((st, idx) => {
      const s = getStudentPersonalStats(cObj, idx);
      const histStr = s.history.map(h => `${h.date}: ${h.txt}`).join(' || ').replace(/"/g, '""');
      const cleanName = st.name.replace(/"/g, '""');
      csv += `"${cName}","${cObj.shift || 'Өглөө'}",${idx + 1},"${cleanName}",${s.present},${s.absent},${s.midSkipHours},${s.leave},${s.sick},${s.noUni}${isTeacher ? ',' + s.noHw : ''},"${histStr}"\n`;
    });
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Arhiv_8surguuli_${targetCls}_${getTodayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  notify(`✅ ${targetCls} ангийн Excel (CSV) архив татагдлаа!`);
}

function svgDonut(pct, color) {
  const r = 24, c = 2 * Math.PI * r;
  const off = c - (pct / 100) * c;
  return `
    <svg width="68" height="68" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="6.5"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6.5"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 32 32)"/>
      <text x="50%" y="54%" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">${pct}%</text>
    </svg>
  `;
}

function renderSocialAnalytics() {
  const isClassLocked = (curUser.role === 'teacher' || curUser.role === 'leader');
  const showHw = (curUser.role === 'teacher' || curUser.role === 'leader');

  const clsList = getSortedClassList();
  if (clsList.length === 0) {
    return `<div class="card"><div class="title">⚠️ Одоогоор анги үүсээгүй байна</div><p style="font-size:12px;color:var(--mut)">Менежер хаягаар орж ангийн багш эсвэл ангийн даргын хаяг нээнэ үү.</p></div>`;
  }

  if (isClassLocked) {
    curClassFilter = curUser.cls;
  } else if (!db.classes[curClassFilter]) {
    curClassFilter = clsList[0];
  }

  const clsObj = db.classes[curClassFilter];
  const sts = clsObj.students || [];
  const total = sts.length || 1;
  const subjs = (clsObj.schedule && clsObj.schedule[curDay]) ? clsObj.schedule[curDay] : [];

  let presCount = 0, uniCount = 0, hwDone = 0;
  const absList = [], midSkipTodayList = [], lateTodayList = [], leaveList = [], sickList = [], noUniList = [], noHwList = [];

  sts.forEach((s, idx) => {
    const rec = getDayRecord(clsObj, curDate, idx);
    if (rec.skipHours && rec.skipHours > 0) {
      midSkipTodayList.push({ s, idx, skipHours: rec.skipHours });
    }
    if (rec.lateMin && rec.lateMin > 0) {
      lateTodayList.push({ s, idx, lateMin: rec.lateMin });
    }

    if (rec.status === 'present') {
      presCount++;
      if (rec.uniform) uniCount++;
      else noUniList.push({ s, idx });

      let missedAny = false;
      subjs.forEach(sub => {
        if (isHwDoneForDate(clsObj, curDate, idx, sub)) hwDone++;
        else missedAny = true;
      });
      if (missedAny) noHwList.push({ s, idx });
    } else if (rec.status === 'absent') absList.push({ s, idx });
    else if (rec.status === 'leave') leaveList.push({ s, idx });
    else if (rec.status === 'sick') sickList.push({ s, idx });
  });

  const presentTotal = presCount || 1;
  const hwTotal = presCount * (subjs.length || 1);

  const attPct = sts.length ? Math.round((presCount / total) * 100) : 0;
  const uniPct = presCount ? Math.round((uniCount / presentTotal) * 100) : 0;
  const hwPct = (presCount && subjs.length) ? Math.round((hwDone / hwTotal) * 100) : 0;

  const mult = curPeriod === '7d' ? 1 : 4;
  let bAbs = 0, bMidSkip = 0, bLeave = 0, bSick = 0, bNoUni = 0, bNoHw = 0;
  sts.forEach((s, idx) => {
    const stStats = getStudentPersonalStats(clsObj, idx);
    bAbs += stStats.absent * mult;
    bMidSkip += stStats.midSkipCnt * mult;
    bLeave += stStats.leave * mult;
    bSick += stStats.sick * mult;
    bNoUni += stStats.noUni * mult;
    bNoHw += stStats.noHw * mult;
  });

  const barItems = [
    { lbl: 'Бүтэн тас', val: bAbs, col: '#f43f5e' },
    { lbl: 'Дундаас тас', val: bMidSkip, col: '#ec4899' },
    { lbl: 'Чөлөө', val: bLeave, col: '#a855f7' },
    { lbl: 'Өвчтэй', val: bSick, col: '#f59e0b' },
    ...(showHw ? [{ lbl: 'Д/Г дутуу', val: bNoHw, col: '#6366f1' }] : []),
    { lbl: 'Формгүй', val: bNoUni, col: '#38bdf8' }
  ];
  const maxB = Math.max(...barItems.map(x => x.val), 5);

  // Анги сонгох BUTTON GRID (9А, 9Б, 10А, 10Б гэх мэт бүтэн дардаг товчнууд)
  let classButtonsHtml = clsList.map(c => {
    const cnt = (db.classes[c].students || []).length;
    return `
      <button class="class-btn ${curClassFilter===c?'active':''}" onclick="curClassFilter='${c}';render()">
        <span>${c}</span>
        <span class="sub-cnt">${cnt} сурагч</span>
      </button>
    `;
  }).join('');

  let barsHtml = barItems.map(b => {
    return `
      <div class="b-col">
        <div class="b-val">${b.val}</div>
        <div class="b-fill" style="height:${Math.round((b.val/maxB)*90)}px;background:${b.col}"></div>
        <div class="b-txt">${b.lbl}</div>
      </div>
    `;
  }).join('');

  return `
    ${renderDateSearchBox('an_date_inp')}
    ${!isClassLocked ? `
      <div class="card">
        <div class="title">
          <span>🏫 Анги сонгох (Товч дээр дарна уу)</span>
          <span style="font-size:11px;color:var(--pri-d);font-weight:800">Сонгосон: ${curClassFilter}</span>
        </div>
        <div class="class-btn-grid">${classButtonsHtml}</div>
      </div>
    ` : ''}

    <div class="card">
      <div class="title">🎯 ${curDate} График (${curClassFilter} анги)</div>
      <div class="${showHw ? 'donuts-3' : 'donuts-2'}">
        <div class="d-box"><div class="d-lbl">📊 ИРЦ</div>${svgDonut(attPct, '#10b981')}<div style="font-size:10px;font-weight:700;margin-top:4px">${presCount}/${sts.length} ирсэн</div></div>
        <div class="d-box"><div class="d-lbl">👕 ФОРМ</div>${svgDonut(uniPct, '#38bdf8')}<div style="font-size:10px;font-weight:700;margin-top:4px">${uniCount}/${presCount} өмссөн</div></div>
        ${showHw ? `<div class="d-box"><div class="d-lbl">📝 ДААЛГАВАР</div>${svgDonut(hwPct, '#6366f1')}<div style="font-size:10px;font-weight:700;margin-top:4px">${hwDone}/${hwTotal} хийсэн</div></div>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="title">
        <span>📊 Баганан Статик (${curClassFilter})</span>
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm ${curPeriod==='7d'?'btn-p':'btn-g'}" onclick="curPeriod='7d';render()">7 хоног</button>
          <button class="btn btn-sm ${curPeriod==='1m'?'btn-p':'btn-g'}" onclick="curPeriod='1m';render()">1 сар</button>
        </div>
      </div>
      <div class="bars">${barsHtml}</div>
    </div>

    <div class="card">
      <div class="title">📋 ${curDate} өдрийн зөрчлийн жагсаалт (${curClassFilter})</div>
      ${renderAlertGroup('❌ Хичээл бүтэн тасалсан', absList, '#f43f5e', clsObj)}
      ${renderAlertGroup('🏃 Хичээлийн дундаас тасалсан (1-7 цаг)', midSkipTodayList, '#ec4899', clsObj)}
      ${renderAlertGroup('⏱️ Хоцорсон сурагчид', lateTodayList, '#f59e0b', clsObj)}
      ${renderAlertGroup('🏃 Чөлөөтэй сурагчид', leaveList, '#a855f7', clsObj)}
      ${renderAlertGroup('🤒 Өвчтэй сурагчид', sickList, '#d97706', clsObj)}
      ${renderAlertGroup('👕 Форм өмсөж ирээгүй', noUniList, '#38bdf8', clsObj)}
      ${showHw ? renderAlertGroup('📝 Гэрийн даалгавар дутуу', noHwList, '#6366f1', clsObj, subjs) : ''}
    </div>
  `;
}

function renderAlertGroup(title, list, color, clsObj, subjs = null) {
  let listHtml = '';
  if (list.length === 0) {
    listHtml = `<div style="font-size:11px;color:#059669;background:#ecfdf5;padding:8px 12px;border-radius:12px;font-weight:700">Зөрчилгүй ✅</div>`;
  } else {
    listHtml = list.map(item => {
      let extra = '';
      const rec = getDayRecord(clsObj, curDate, item.idx);
      if (item.skipHours) {
        extra += ` <span style="color:#e11d48;font-size:11px">(${item.skipHours} цаг тасалсан)</span>`;
      }
      if (item.lateMin) {
        extra += ` <span style="color:#d97706;font-size:11px">(${item.lateMin} мин хоцорсон)</span>`;
      }
      if (subjs && subjs.length > 0 && rec.status === 'present') {
        const missed = subjs.filter(sub => !isHwDoneForDate(clsObj, curDate, item.idx, sub));
        if (missed.length > 0) extra += ` <span style="color:var(--err);font-size:11px">(Дутуу: ${missed.join(', ')})</span>`;
      }
      if ((rec.status === 'leave' || rec.status === 'sick') && rec.leaveReason) {
        const reasonCol = rec.status === 'sick' ? 'var(--warn)' : 'var(--purp)';
        extra += `<div style="color:${reasonCol};font-size:10px;margin-top:3px;">Шалтгаан: ${rec.leaveReason}</div>`;
      }
      return `<div style="padding:8px 12px;background:#f8fafc;border-left:3.5px solid ${color};border-radius:10px;font-size:12px;font-weight:700;margin-bottom:5px">${item.s.name}${extra}</div>`;
    }).join('');
  }
  return `<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:800;color:${color};margin-bottom:5px">${title} (${list.length})</div>${listHtml}</div>`;
}

  db.classes[curUser.cls].shift = document.getElementById('t_shift').value;

}

function saveSchedule() {
  const cls = db.classes[curUser.cls];
  if (!cls.schedule) cls.schedule = {};
  [1,2,3,4,5].forEach(d => {
    const val = document.getElementById('sch_' + d).value;
    cls.schedule[d] = val.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  });
  saveDB();
  notify('✅ 1-5 дахь өдрийн хичээлийн хуваарь хадгалагдлаа!');
  render();
}

function addClassStudents() {
  const raw = document.getElementById('t_names').value.trim();
  if (!raw) return notify('⚠️ Сурагчдын нэрсийг оруулна уу!');
  const names = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  const cls = db.classes[curUser.cls];
  if (!Array.isArray(cls.students)) cls.students = [];
  names.forEach(n => cls.students.push({ name: n }));
  saveDB();
  notify(`✅ ${names.length} сурагч нэмэгдлээ!`);
  render();
}

function renderAttendanceBoard(cls) {
  const dayNames = { 1:'Даваа', 2:'Мягмар', 3:'Лхагва', 4:'Пүрэв', 5:'Баасан' };
  if (!cls.schedule) cls.schedule = { 1:[], 2:[], 3:[], 4:[], 5:[] };

  const stMap = {
    present: { lbl: '✅ Ирсэн', cls: 'c-pres' },
    absent: { lbl: '❌ Тасалсан', cls: 'c-abs' },
    sick: { lbl: '🤒 Өвчтэй', cls: 'c-sick' },
    leave: { lbl: '🏃 Чөлөөтэй', cls: 'c-leav' }
  };

  let dayTabsHtml = [1,2,3,4,5].map(d => {
    return `<button class="tab ${curDay===d?'active':''}" onclick="curDay=${d};render()">${dayNames[d]}</button>`;
  }).join('');

  const isLocked = parseDateStr(curDate) < parseDateStr(getTodayStr());

  let studentsHtml = '';

    studentsHtml = `
      <div class="card">

      </div>
    `;
  } else {
    let studentRows = cls.students.map((s, idx) => {
      const rec = getDayRecord(cls, curDate, idx);
      const isPresent = (rec.status === 'present');
      const stInfo = stMap[rec.status] || stMap.present;
      const doneCnt = isPresent ? subjs.filter(sub => isHwDoneForDate(cls, curDate, idx, sub)).length : 0;
      const allDone = isPresent && (doneCnt === subjs.length);
      const initials = s.name.trim().slice(0, 2).toUpperCase();

      let actionChips = '';
      if (isPresent) {
        actionChips = `
          <div class="chip ${rec.uniform ? 'c-uni-y' : 'c-uni-n'}" onclick="toggleUni(${idx})">
            ${rec.uniform ? '👕 Формтой' : '❌ Формгүй'}
          </div>
          <div class="chip ${allDone ? 'c-hw-y' : 'c-hw-n'}" onclick="openHwModal(${idx})">
            📝 Д/Г: ${doneCnt}/${subjs.length}
          </div>
        `;
      } else {
        actionChips = `
          <div class="chip c-zero" onclick="notify('⚠️ Ирээгүй сурагчийн форм 0 байна!')">👕 Форм: 0</div>
          <div class="chip c-zero" onclick="notify('⚠️ Ирээгүй сурагчийн даалгавар 0 байна!')">📝 Д/Г: 0</div>
        `;
      }

      let extraTags = '';
      if (rec.lateMin > 0 || rec.skipHours > 0) {
        extraTags = `<div class="extra-badges">`;
        if (rec.lateMin > 0) {
          extraTags += `<span class="mini-tag" style="background:#fef3c7;color:#d97706">⏱️ Хоцролт: ${rec.lateMin} мин</span>`;
        }
        if (rec.skipHours > 0) {
          extraTags += `<span class="mini-tag" style="background:#ffe4e6;color:#e11d48">🏃 Дундаас тасалсан: ${rec.skipHours} цаг</span>`;
        }
        extraTags += `</div>`;
      }

      let leaveInput = '';
      if (rec.status === 'leave' || rec.status === 'sick') {
        const isSick = rec.status === 'sick';
        const brColor = isSick ? '#fbbf24' : '#c084fc';
        const bgCol = isSick ? '#fffbeb' : '#faf5ff';
        const plc = isSick ? '🤒 Өвчний шалтгаан бичих (макс 40 үсэг)...' : '🏃 Чөлөөний шалтгаан бичих (макс 40 үсэг)...';
        leaveInput = `<input type="text" maxlength="40" placeholder="${plc}" value="${rec.leaveReason || ''}" oninput="updateLeaveReason(${idx}, this.value)" style="width:100%; padding:10px 14px; border-radius:14px; border:1.5px dashed ${brColor}; background:${bgCol}; font-size:11px; margin-top:10px; margin-bottom:0; outline:none; font-weight:700; color:var(--txt);" ${isLocked ? 'disabled' : ''}>`;
      }

      // Ангийн дарга бол зөвхөн Таслалт (1-7 цаг) ба Хоцролт (1-80 мин) цэс нээнэ
      const dotAction = (curUser.role === 'leader')
        ? `openLeaderTaslaltModal(${idx})`
        : `openStudentStatsModal(${idx})`;

      return `
        <div class="st-card">
          <div class="st-top">
            <div class="st-name-wrap">
              <div class="avatar">${initials}</div>
              <span>${idx + 1}. ${s.name}</span>
            </div>
            <div class="st-right">
              <span class="status-mini">
                ${!isPresent ? 'Хоосон (0) ⚪' : (allDone ? 'Д/Г Бүрэн ✅' : 'Д/Г Дутуу ⚠️')}
              </span>
              <button class="dots-btn" title="Таслалт ба Хоцролт" onclick="${dotAction}">⋮</button>
            </div>
          </div>
          <div class="chips">
            <div class="chip ${stInfo.cls}" onclick="cycleStatus(${idx})">${stInfo.lbl}</div>
            ${actionChips}
          </div>
          ${extraTags}
          ${leaveInput}
        </div>
      `;
    }).join('');

    studentsHtml = `
      <div>${studentRows}</div>
      ${isLocked ? 
        `<div style="text-align:center; padding:14px; background:#fff1f2; color:#e11d48; border-radius:16px; font-size:12px; font-weight:800; margin-top:8px; border:1px solid #fecdd3;">🔒 Өнгөрсөн өдрийн мэдээллийг өөрчлөх боломжгүй (Зөвхөн харах).</div>` 
        : 
        `<button class="btn btn-p" onclick="saveDB();notify('✅ ${curDate} өдрийн бүртгэл үүлэн санах ойд хадгалагдлаа!')">💾 ${curDate} Бүртгэл хадгалах</button>`
      }
    `;
  }

  return `
    ${renderDateSearchBox('att_date_inp')}
    <div class="card">
      <div class="title"><span>📅 Гараг сонгох (${cls.shift || 'Өглөө'} ээлж)</span></div>
      <div class="tabs">${dayTabsHtml}</div>
      <div style="font-size:11px;color:var(--mut);margin-top:10px;font-weight:700">
        📚 Хичээлүүд: <span style="color:var(--pri)">${subjs.length ? subjs.join(', ') : 'Хуваарь оруулаагүй байна'}</span>
      </div>
    </div>
    ${studentsHtml}
  `;
}

// =========================================================
// 9. АНГИЙН ДАРГЫН 3 ЦЭГ (`⋮`) — ЗӨВХӨН ТАСЛАЛТ (1-7 ЦАГ BUTTON) БА ХОЦРОЛТ (1-80 МИН)
// =========================================================
let tempSkipHours = 0;

function openLeaderTaslaltModal(idx) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const rec = getDayRecord(cls, curDate, idx);
  tempSkipHours = rec.skipHours || 0;

  // 1-ээс 80 минут хүртэлх бүх сонголтыг үүсгэх
  let lateOptionsHtml = `<option value="0" ${rec.lateMin === 0 ? 'selected' : ''}>✅ Хоцроогүй (0 минут)</option>`;
  for (let m = 1; m <= 80; m++) {
    lateOptionsHtml += `<option value="${m}" ${rec.lateMin === m ? 'selected' : ''}>⏱️ ${m} минут хоцорсон</option>`;
  }

  // 1-7 цаг таслалтын дардаг Button-ууд
  let hourButtonsHtml = `
    <button type="button" id="hbtn_0" class="hour-btn ${tempSkipHours === 0 ? 'active-zero' : ''}" onclick="selectSkipHourBtn(0)">
      0 цаг<br><span style="font-size:9px;font-weight:700">Таслаагүй</span>
    </button>
  `;
  for (let h = 1; h <= 7; h++) {
    hourButtonsHtml += `
      <button type="button" id="hbtn_${h}" class="hour-btn ${tempSkipHours === h ? 'active-abs' : ''}" onclick="selectSkipHourBtn(${h})">
        ${h} цаг<br><span style="font-size:9px;font-weight:700">тасалсан</span>
      </button>
    `;
  }

  openModal(`
    <div class="title">
      <span>📌 Таслалт & Хоцролт — ${st.name}</span>
      <button class="btn btn-sm btn-g" onclick="closeModal()">✕</button>
    </div>

    <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:18px;padding:14px;margin-bottom:14px">
      <label style="font-size:12px;font-weight:800;color:#b45309;display:block;margin-bottom:8px">
        ⏱️ 1. Хоцролт бүртгэх (1 – 80 минут):
      </label>
      <select id="ldr_late_select" style="margin-bottom:0;background:#fff;border-color:#fcd34d">
        ${lateOptionsHtml}
      </select>
    </div>

    <div style="background:#fff1f2;border:1.5px solid #fecdd3;border-radius:18px;padding:14px;margin-bottom:14px">
      <label style="font-size:12px;font-weight:800;color:#be123c;display:block;margin-bottom:8px">
        🏃 2. Хичээлийн дундаас таслалт (1 – 7 цаг дарж сонгох):
      </label>
      <div class="hour-btn-grid">
        ${hourButtonsHtml}
      </div>
      <div style="font-size:10px;color:#e11d48;font-weight:700;text-align:center">
        Дээрх 1–7 цагийн товчноос дарж хичээлийн дундаас тасалсан цагийг тэмдэглэнэ.
      </div>
    </div>

    <button class="btn btn-p" onclick="saveLeaderTaslaltModal(${idx})">💾 Бүртгэл хадгалах</button>
  `);
}

function selectSkipHourBtn(h) {
  tempSkipHours = h;
  for (let i = 0; i <= 7; i++) {
    const btn = document.getElementById('hbtn_' + i);
    if (!btn) continue;
    btn.className = 'hour-btn';
    if (i === h) {
      btn.classList.add(h === 0 ? 'active-zero' : 'active-abs');
    }
  }
}

function saveLeaderTaslaltModal(idx) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);

  const lateVal = parseInt(document.getElementById('ldr_late_select').value, 10) || 0;
  rec.lateMin = Math.min(80, Math.max(0, lateVal));
  rec.skipHours = tempSkipHours;

  saveDB();
  closeModal();
  notify(`✅ Хадгалагдлаа! (Хоцролт: ${rec.lateMin} мин, Дундаас таслалт: ${rec.skipHours} цаг)`);
  render();
}

// Багш нар `⋮` дарахад хувийн статистик + ангийн даргын цэс рүү орох товч харагдана
function openStudentStatsModal(idx) {
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const pStats = getStudentPersonalStats(cls, idx);

  let histHtml = pStats.history.length === 0
    ? `<div style="font-size:11px;color:var(--mut);padding:10px 0">Одоогоор түүх бүртгэгдээгүй байна.</div>`
    : pStats.history.map(h => `
        <div style="padding:9px 12px;background:#f8fafc;border-radius:12px;font-size:11px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px">
          <span style="color:var(--pri);white-space:nowrap">${h.date}</span>
          <span style="text-align:right">${h.txt}</span>
        </div>
      `).join('');

  openModal(`
    <div class="title">
      <span>👤 ${st.name} (${curUser.cls})</span>
      <button class="btn btn-sm btn-g" onclick="closeModal()">✕</button>
    </div>
    <button class="btn btn-sm btn-p" style="width:100%;margin-bottom:12px" onclick="openLeaderTaslaltModal(${idx})">
      ⏱️ Хоцролт (1-80м) & Дундаас таслалт (1-7ц) тэмдэглэх
    </button>
    <div class="stat-grid">
      <div class="stat-pill" style="border-left:4px solid var(--err)"><div class="num" style="color:var(--err)">${pStats.absent}</div><div class="lbl">❌ Бүтэн тасалсан</div></div>
      <div class="stat-pill" style="border-left:4px solid var(--purp)"><div class="num" style="color:var(--purp)">${pStats.midSkipHours}ц</div><div class="lbl">🏃 Дундаас тасалсан</div></div>
      <div class="stat-pill" style="border-left:4px solid var(--warn)"><div class="num" style="color:var(--warn)">${pStats.sick}</div><div class="lbl">🤒 Өвчтэй</div></div>
      <div class="stat-pill" style="border-left:4px solid var(--sec)"><div class="num" style="color:var(--sec)">${pStats.noUni}</div><div class="lbl">👕 Формгүй</div></div>
    </div>
    <div class="u-row" style="border-left-color:var(--pri);margin-bottom:14px">
      <span>📝 Гэрийн даалгавар дутуу хийсэн:</span>
      <b style="color:var(--pri)">${pStats.noHw} удаа</b>
    </div>
    <div style="font-size:12px;font-weight:800;margin-bottom:8px">📅 Бүртгэгдсэн өдрүүдийн түүх:</div>
    ${histHtml}
    <button class="btn btn-g" style="margin-top:12px" onclick="closeModal()">Хаах</button>
  `);
}

function cycleStatus(idx) {
  if (isEditLocked()) return;
  const order = ['present', 'absent', 'sick', 'leave'];
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  const nextStatus = order[(order.indexOf(rec.status) + 1) % order.length];
  rec.status = nextStatus;

  if (nextStatus !== 'present') {
    rec.uniform = false;
    rec.hw = {};
    (cls.schedule[curDay] || []).forEach(sub => { rec.hw[sub] = false; });
  } else {
    rec.uniform = true;
    rec.hw = {};
    (cls.schedule[curDay] || []).forEach(sub => { rec.hw[sub] = true; });
  }
  saveDB(); render();
}

function toggleUni(idx) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  if (rec.status !== 'present') return;
  rec.uniform = !rec.uniform;
  saveDB(); render();
}

function openHwModal(idx) {
  const cls = db.classes[curUser.cls];
  const st = cls.students[idx];
  const rec = getDayRecord(cls, curDate, idx);
  if (rec.status !== 'present') return notify('⚠️ Ирээгүй сурагчийн даалгавар 0 (хоосон) байна!');

  const subjs = (cls.schedule && cls.schedule[curDay]) ? cls.schedule[curDay] : [];
  if (subjs.length === 0) return notify('⚠️ Багш энэ өдрийн хичээлийн хуваарийг оруулаагүй байна!');

  const isLocked = parseDateStr(curDate) < parseDateStr(getTodayStr());

  let subjsHtml = subjs.map(sub => {
    const done = isHwDoneForDate(cls, curDate, idx, sub);
    let btnsHtml = isLocked
      ? `<span style="font-size:11px;font-weight:700;color:${done ? 'var(--ok)' : 'var(--err)'}">${done ? 'Хийсэн ✓' : 'Хийгээгүй ✗'}</span>`
      : `<button class="btn btn-sm ${done ? 'btn-ok' : 'btn-g'}" onclick="setHw(${idx},'${sub}',true)">Хийсэн ✓</button>
         <button class="btn btn-sm ${!done ? 'btn-err' : 'btn-g'}" onclick="setHw(${idx},'${sub}',false)">Хийгээгүй ✗</button>`;

    return `
      <div class="u-row" style="border-left-color:${done ? 'var(--ok)' : 'var(--err)'}">
        <span style="font-weight:800;font-size:13px">${sub}</span>
        <div style="display:flex;gap:6px;align-items:center;">${btnsHtml}</div>
      </div>
    `;
  }).join('');

  openModal(`
    <div class="title">
      <span>📝 ${st.name} (${curDate})</span>
      <button class="btn btn-sm btn-g" onclick="closeModal()">✕</button>
    </div>
    ${subjsHtml}
    <button class="btn btn-p" style="margin-top:10px" onclick="closeModal()">✅ Болсон</button>
  `);
}

function setHw(idx, sub, val) {
  if (isEditLocked()) return;
  const cls = db.classes[curUser.cls];
  const rec = getDayRecord(cls, curDate, idx);
  if (!rec.hw) rec.hw = {};
  rec.hw[sub] = val;
  saveDB(); openHwModal(idx); render();
}

render();
initFirebaseCloud();
</script>
</body>
</html>
